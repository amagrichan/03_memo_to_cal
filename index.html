<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふわふわメモカレンダー</title>
  <!-- Google Fonts: ほのぼの丸ゴシック -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome アイコン -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #c7d2fe 0%, #e0f2fe 40%, #f0f9ff 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary-blue: #38bdf8;
      --primary-hover: #0284c7;
      --light-blue: #f0f9ff;
      --accent-blue: #bae6fd;
      --text-main: #334155;
      --text-muted: #64748b;
      --shadow-cloud: 0 16px 40px rgba(56, 189, 248, 0.22);
    }

    * {
      box-sizing: border-box;
      font-family: 'M PLUS Rounded 1c', -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* 背景のキラキラアニメーション */
    .sparkle {
      position: absolute;
      color: #ffffff;
      opacity: 0.6;
      animation: floatSparkle 6s infinite ease-in-out;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatSparkle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-20px) scale(1.3); opacity: 0.8; }
    }

    /* 空に浮かぶヘッダータイトルアニメーション */
    .header {
      text-align: center;
      margin-bottom: 36px;
      z-index: 1;
      animation: floatTitle 4s infinite ease-in-out;
    }

    @keyframes floatTitle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    .header h1 {
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      color: #0284c7;
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 24px;
      border-radius: 50px;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(4px);
    }

    .header p {
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      color: #475569;
      margin-top: 10px;
      margin-bottom: 0;
      font-weight: 700;
    }

    /* コンテナ（カード本体） */
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 32px;
      padding: clamp(20px, 5vw, 32px);
      box-shadow: var(--shadow-cloud);
      border: 4px solid #ffffff;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(8px);
    }

    /* 【枠外配置】もこもこ雲に乗ったおやすみうさぎ */
    .outside-bunny-wrapper {
      position: absolute;
      top: -55px; /* 枠外の上に飛び出させる */
      right: -10px; /* 枠外の右側に寄せる */
      width: 110px;
      height: 110px;
      pointer-events: none;
      z-index: 10;
      animation: floatBunnyCloud 4s infinite ease-in-out;
    }

    .bunny-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 16px rgba(56, 189, 248, 0.3));
    }

    @keyframes floatBunnyCloud {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 16px;
      border: 2px solid var(--accent-blue);
      border-radius: 20px;
      font-size: 1rem;
      color: var(--text-main);
      background-color: var(--light-blue);
      outline: none;
      transition: all 0.25s ease;
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--primary-blue);
      background-color: #ffffff;
      box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.25);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 22px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.28);
    }

    .btn-parse {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
    }

    .btn-parse:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 10px 24px rgba(56, 189, 248, 0.4);
    }

    .btn-parse:active {
      transform: translateY(0) scale(0.99);
    }

    /* 結果カード */
    .preview-card {
      margin-top: 24px;
      background: var(--light-blue);
      border: 2px dashed var(--accent-blue);
      border-radius: 24px;
      padding: 20px;
      display: none;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .preview-card h2 {
      margin-top: 0;
      font-size: 1.15rem;
      color: #0369a1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field {
      margin-bottom: 10px;
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid #e0f2fe;
    }

    .field-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 800;
    }

    .field-value {
      font-size: 1rem;
      color: var(--text-main);
      font-weight: 700;
      word-break: break-all;
    }

    .calendar-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-apple {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
    }

    .btn-timetree {
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.3);
    }

    .btn-apple:hover, .btn-timetree:hover {
      transform: translateY(-2px);
    }

    .tip-box {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.5;
      border: 1px solid #e0f2fe;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(51, 65, 85, 0.95);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      backdrop-filter: blur(4px);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<!-- キラキラの背景演出 -->
<i class="fa-solid fa-star sparkle" style="top: 10%; left: 8%; font-size: 1.2rem; animation-delay: 0s;"></i>
<i class="fa-solid fa-sparkles sparkle" style="top: 20%; right: 10%; font-size: 1.5rem; animation-delay: 1.5s;"></i>
<i class="fa-solid fa-cloud sparkle" style="top: 75%; left: 5%; font-size: 2rem; animation-delay: 2.5s;"></i>
<i class="fa-solid fa-star sparkle" style="bottom: 12%; right: 8%; font-size: 1rem; animation-delay: 0.8s;"></i>

<!-- 空にゆらゆら浮かぶヘッダー -->
<div class="header">
  <h1><i class="fa-solid fa-cloud-moon" style="color: #38bdf8;"></i> ふわっとメモカレンダー</h1>
  <p>✨ メモを入れるだけでカレンダーにすぐ登録できるよ ✨</p>
</div>

<div class="container">

  <!-- 枠外に配置した「もこもこ雲に乗ったおやすみうさぎ」 -->
  <div class="outside-bunny-wrapper">
    <svg class="bunny-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 三日月 -->
      <path d="M 25 28 A 12 12 0 0 0 37 40 A 10 10 0 0 1 25 28 Z" fill="#fef08a"/>
      <!-- ちいさな星 -->
      <polygon points="90,20 92,24 96,25 93,28 94,32 90,30 86,32 87,28 84,25 88,24" fill="#fef08a"/>
      <polygon points="18,55 19.5,58 22.5,58.5 20,60.5 21,63.5 18,62 15,63.5 16,60.5 13.5,58.5 16.5,58" fill="#bae6fd"/>

      <!-- もこもこ雲本体 -->
      <g filter="drop-shadow(0 4px 6px rgba(56,189,248,0.15))">
        <path d="M 25 80 
                 C 15 80, 10 70, 20 62 
                 C 15 50, 30 42, 42 48 
                 C 50 38, 70 38, 78 48 
                 C 90 42, 105 50, 100 62 
                 C 110 70, 105 80, 95 80 
                 Z" fill="#ffffff"/>
        <!-- 雲のニュアンス陰影（水色） -->
        <path d="M 25 80 C 40 85, 80 85, 95 80 C 102 75, 98 68, 92 70 C 75 78, 40 78, 25 70 Z" fill="#e0f2fe"/>
      </g>

      <!-- うさぎ（雲の上ですやすや） -->
      <!-- うさぎの耳（横に寝かせ気味） -->
      <ellipse cx="48" cy="46" rx="14" ry="6" transform="rotate(-25 48 46)" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
      <ellipse cx="48" cy="46" rx="9" ry="3.5" transform="rotate(-25 48 46)" fill="#38bdf8" opacity="0.3"/>
      
      <ellipse cx="42" cy="51" rx="13" ry="5.5" transform="rotate(-40 42 51)" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
      <ellipse cx="42" cy="51" rx="8" ry="3" transform="rotate(-40 42 51)" fill="#38bdf8" opacity="0.3"/>

      <!-- うさぎの体＆顔（まるまって寝ている） -->
      <ellipse cx="62" cy="58" rx="16" ry="13" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
      
      <!-- すやすや目 (u_u) -->
      <path d="M 66 57 Q 69 61 72 57" stroke="#0369a1" stroke-width="2" stroke-linecap="round" fill="none"/>
      
      <!-- ほんのりピンク水色のほっぺ -->
      <circle cx="73" cy="61" r="3" fill="#38bdf8" opacity="0.4"/>

      <!-- すやすやの「zZZ」 -->
      <text x="82" y="42" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif" opacity="0.8">z</text>
      <text x="89" y="35" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif" opacity="0.9">Z</text>
    </svg>
  </div>

  <div class="input-group">
    <label for="memoInput"><i class="fa-solid fa-pen-nib"></i> メモを入力してね</label>
    <textarea id="memoInput" placeholder="例：&#10;8月10日 15:00 カフェで打ち合わせ&#10;〇〇さんと新プロジェクトの進捗確認をする！"></textarea>
  </div>

  <button class="btn btn-parse" onclick="parseMemo()">
    <i class="fa-solid fa-wand-magic-sparkles"></i> 予定を魔法でまとめる
  </button>

  <!-- 結果表示エリア -->
  <div id="previewCard" class="preview-card">
    <h2><i class="fa-solid fa-wand-sparkles" style="color: #38bdf8;"></i> まとめた結果</h2>
    
    <div class="field">
      <div class="field-label">日時</div>
      <div class="field-value" id="resDateTime">-</div>
    </div>

    <div class="field">
      <div class="field-label">件名</div>
      <div class="field-value" id="resTitle">-</div>
    </div>

    <div class="field">
      <div class="field-label">詳細内容</div>
      <div class="field-value" id="resBody" style="white-space: pre-wrap; font-weight: 400;">-</div>
    </div>

    <div class="calendar-actions">
      <!-- iPhoneカレンダーボタン -->
      <button class="btn btn-apple" onclick="downloadICS()">
        <i class="fa-brands fa-apple"></i> iPhoneカレンダーに追加 (.ics)
      </button>

      <!-- TimeTreeボタン -->
      <button class="btn btn-timetree" onclick="openTimeTree()">
        <i class="fa-solid fa-tree"></i> TimeTreeに追加（コピー＆起動）
      </button>
    </div>

    <div class="tip-box">
      <strong>💡 アプリ連携のアドバイス</strong><br>
      • <strong>iPhoneカレンダー:</strong> ボタンを押すとそのまま予定追加画面が開きます。<br>
      • <strong>TimeTree:</strong> 予定内容がコピーされた状態でアプリが開きます。新規作成画面に貼り付けて登録してね♪
    </div>
  </div>
</div>

<div id="toast" class="toast">クリップボードにコピーしたよ！</div>

<script>
let parsedEvent = null;

function parseMemo() {
  const text = document.getElementById('memoInput').value.trim();
  if (!text) {
    alert('メモを入力してくださいね！');
    return;
  }

  const now = new Date();
  let year = now.getFullYear();
  let month = now.getMonth() + 1;
  let day = now.getDate();
  let hour = 10;
  let minute = 0;

  if (text.includes('明日') || text.includes('あした')) {
    const tomorrow = new Date(now);
    tomorrow.setDate(now.getDate() + 1);
    year = tomorrow.getFullYear();
    month = tomorrow.getMonth() + 1;
    day = tomorrow.getDate();
  } else if (text.includes('明後日') || text.includes('あさって')) {
    const dayAfter = new Date(now);
    dayAfter.setDate(now.getDate() + 2);
    year = dayAfter.getFullYear();
    month = dayAfter.getMonth() + 1;
    day = dayAfter.getDate();
  } else {
    const fullDateMatch = text.match(/(\d{4})[\/\.-年](\d{1,2})[\/\.-月](\d{1,2})/);
    const shortDateMatch = text.match(/(\d{1,2})[\/\.-月](\d{1,2})日?/);

    if (fullDateMatch) {
      year = parseInt(fullDateMatch[1]);
      month = parseInt(fullDateMatch[2]);
      day = parseInt(fullDateMatch[3]);
    } else if (shortDateMatch) {
      month = parseInt(shortDateMatch[1]);
      day = parseInt(shortDateMatch[2]);
    }
  }

  const timeMatch = text.match(/(\d{1,2})[:：](\d{2})/) || text.match(/(\d{1,2})時((\d{1,2})分)?/);
  if (timeMatch) {
    hour = parseInt(timeMatch[1]);
    if (timeMatch[2] && !timeMatch[2].includes('分')) {
      minute = parseInt(timeMatch[2]);
    } else if (timeMatch[3]) {
      minute = parseInt(timeMatch[3]);
    }
  }

  const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
  let titleText = lines[0] || '新規予定';
  titleText = titleText
    .replace(/(\d{4}[\/\.-年])?\d{1,2}[\/\.-月]\d{1,2}日?/, '')
    .replace(/(\d{1,2}[:：]\d{2}|\d{1,2}時(\d{1,2}分)?)/, '')
    .replace(/(明日|あした|明後日|あさって|今日)/, '')
    .trim();

  if (!titleText) titleText = '予定';

  const description = lines.length > 1 ? lines.slice(1).join('\n') : text;

  const startDate = new Date(year, month - 1, day, hour, minute);
  const endDate = new Date(year, month - 1, day, hour + 1, minute);

  parsedEvent = {
    start: startDate,
    end: endDate,
    year, month, day, hour, minute,
    title: titleText,
    description: description
  };

  const pad = n => String(n).padStart(2, '0');
  document.getElementById('resDateTime').textContent = 
    `${year}年${month}月${day}日 ${pad(hour)}:${pad(minute)} 〜 ${pad(hour+1)}:${pad(minute)}`;
  document.getElementById('resTitle').textContent = parsedEvent.title;
  document.getElementById('resBody').textContent = parsedEvent.description;

  document.getElementById('previewCard').style.display = 'block';
}

function formatDateToICS(date) {
  return date.toISOString().replace(/-|:|\.\d\d\d/g, '');
}

function downloadICS() {
  if (!parsedEvent) return;

  const icsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//FuwaFuwa Memo App//JA
BEGIN:VEVENT
SUMMARY:${parsedEvent.title}
DESCRIPTION:${parsedEvent.description.replace(/\n/g, '\\n')}
DTSTART:${formatDateToICS(parsedEvent.start)}
DTEND:${formatDateToICS(parsedEvent.end)}
END:VEVENT
END:VCALENDAR`;

  const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${parsedEvent.title}.ics`;
  a.click();
  URL.revokeObjectURL(url);
}

function openTimeTree() {
  if (!parsedEvent) return;

  const pad = n => String(n).padStart(2, '0');
  const copyText = `【${parsedEvent.title}】\n日時: ${parsedEvent.year}/${parsedEvent.month}/${parsedEvent.day} ${pad(parsedEvent.hour)}:${pad(parsedEvent.minute)}\n\nメモ:\n${parsedEvent.description}`;

  navigator.clipboard.writeText(copyText).then(() => {
    showToast('コピーしたよ！TimeTreeを開きます♪');
    setTimeout(() => {
      window.location.href = 'timetree://';
      setTimeout(() => {
        window.location.href = 'https://timetreeapp.com/';
      }, 1500);
    }, 800);
  }).catch(() => {
    alert('コピーに失敗しちゃいました。手動でコピーしてね。');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>

</body>
</html>
