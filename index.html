<body>

<div class="background">

<div class="blur blur1"></div>
<div class="blur blur2"></div>
<div class="blur blur3"></div>

<div class="sparkles">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

</div>

<header>

<div class="logo">

<div class="logo-circle">
✨
</div>

<div>

<h1>
Memo Calendar
</h1>

<p>
AIでメモから予定を整理
</p>

</div>

</div>

<nav>

<button
class="glassButton"
id="installButton">

アプリを追加

</button>

</nav>

</header>

<main>

<section class="hero">

<h2>

今日の予定を書くだけ

</h2>

<p>

メモを入力すると、
件名・日時・内容を自動で整理し、
カレンダーへ追加できます。

</p>

</section>

<section class="glassCard">

<div class="cardTitle">

📝 メモ入力

</div>

<textarea

id="memo"

placeholder="例

明日の14時 歯医者

保険証を持つ
コンビニへ寄る
診察券"

></textarea>

<div class="buttonArea">

<button
id="analyzeButton"
class="primaryButton">

✨ AI解析する

</button>

<button
id="clearButton"
class="subButton">

クリア

</button>

</div>

</section>
<section
class="glassCard resultCard"
id="resultCard"
style="display:none;">

<div class="cardTitle">

📅 解析結果

</div>

<div class="resultItem">

<label>

件名

</label>

<input
type="text"
id="eventTitle">

</div>

<div class="resultItem">

<label>

日付

</label>

<input
type="date"
id="eventDate">

</div>

<div class="resultRow">

<div class="resultItem">

<label>

開始

</label>

<input
type="time"
id="startTime">

</div>

<div class="resultItem">

<label>

終了

</label>

<input
type="time"
id="endTime">

</div>

</div>

<div class="resultItem">

<label>

内容

</label>

<textarea
id="eventDescription"></textarea>

</div>        <div class="buttonArea bottomButtons">

            <button
                id="downloadButton"
                class="primaryButton">

                📅 カレンダーへ追加

            </button>

            <button
                id="editButton"
                class="subButton">

                ✏ 編集

            </button>

        </div>

    </section>

    <!-- 完了モーダル -->

    <div
        class="modal"
        id="completeModal">

        <div class="modalCard">

            <div class="modalIcon">
                ✨
            </div>

            <h2>

                ICSファイルを作成しました

            </h2>

            <p>

                ダウンロードしたファイルを
                iPhoneで開くと、
                標準カレンダーへ追加できます。

            </p>

            <button
                id="closeModal"
                class="primaryButton">

                OK

            </button>

        </div>

    </div>

</main>

<footer>

    <div class="footerGlass">

        <div>

            <strong>

                Memo Calendar

            </strong>

        </div>

        <div>

            AIでメモを予定に変える
            シンプルなカレンダーアプリ

        </div>

    </div>

</footer>

<!-- キラキラ背景 -->

<div class="shine shine1"></div>
<div class="shine shine2"></div>
<div class="shine shine3"></div>

<!-- Script -->

<script src="script.js"></script>

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("./service-worker.js")
            .then(() => {

                console.log("Service Worker Registered");

            })
            .catch(err => {

                console.log(err);

            });

    });

}

</script>

<script>

let deferredPrompt;

const installButton =
document.getElementById("installButton");

window.addEventListener("beforeinstallprompt", (e)=>{

    e.preventDefault();

    deferredPrompt = e;

    installButton.style.display = "inline-flex";

});

installButton.addEventListener("click", async()=>{

    if(!deferredPrompt) return;

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt = null;

    installButton.style.display="none";

});

window.addEventListener("appinstalled",()=>{

    installButton.style.display="none";

});

</script>

</body>
