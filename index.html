<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- iPhone / PWA表示向け -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#eef9ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta name="apple-mobile-web-app-title" content="きらめきカレンダー">

  <title>きらめきカレンダー</title>

  <style>
    /* ========================================
       基本設定
    ======================================== */

    :root {
      --ink: #27374d;
      --muted: #71849c;
      --blue: #69aefc;
      --blue-dark: #418ee9;
      --sky: #dff5ff;
      --white-glass: rgba(255, 255, 255, 0.57);
      --border: rgba(255, 255, 255, 0.82);
      --shadow:
        0 25px 70px rgba(78, 139, 180, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: #edf9ff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic UI",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(255, 255, 255, 0.98) 0 6%,
          transparent 25%
        ),
        radial-gradient(
          circle at 82% 15%,
          rgba(208, 242, 255, 0.88),
          transparent 33%
        ),
        radial-gradient(
          circle at 76% 82%,
          rgba(255, 243, 222, 0.8),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #faffff 0%,
          #e5f7ff 43%,
          #f9fbff 70%,
          #fff7ec 100%
        );
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    /* ========================================
       背景装飾
    ======================================== */

    .background-effects {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora {
      position: absolute;
      border-radius: 999px;
      filter: blur(40px);
      opacity: 0.62;
      animation: floatAurora 10s ease-in-out infinite alternate;
    }

    .aurora-one {
      top: -8%;
      left: -9%;
      width: 360px;
      height: 360px;
      background: rgba(168, 226, 255, 0.76);
    }

    .aurora-two {
      right: -12%;
      bottom: -7%;
      width: 430px;
      height: 430px;
      background: rgba(255, 225, 183, 0.66);
      animation-delay: -4s;
    }

    .aurora-three {
      top: 35%;
      left: 45%;
      width: 280px;
      height: 280px;
      background: rgba(220, 207, 255, 0.38);
      animation-delay: -2s;
    }

    @keyframes floatAurora {
      from {
        transform: translate3d(-12px, -10px, 0) scale(0.94);
      }

      to {
        transform: translate3d(18px, 22px, 0) scale(1.08);
      }
    }

    .bubbles {
      position: absolute;
      inset: 0;
    }

    .bubble {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--left);
      bottom: -100px;
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.18) 42%,
          rgba(128, 208, 255, 0.12)
        );
      border: 1px solid rgba(255, 255, 255, 0.76);
      box-shadow:
        inset 0 0 18px rgba(255, 255, 255, 0.66),
        0 8px 26px rgba(73, 155, 202, 0.11);
      animation: rise var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.72);
        opacity: 0;
      }

      15% {
        opacity: 0.7;
      }

      85% {
        opacity: 0.4;
      }

      100% {
        transform: translateY(-125vh) translateX(25px) scale(1.12);
        opacity: 0;
      }
    }

    .sparkles {
      position: absolute;
      inset: 0;
    }

    .sparkle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--spark-size);
      height: var(--spark-size);
      animation: twinkle var(--speed) ease-in-out infinite;
      animation-delay: var(--delay);
      opacity: 0;
    }

    .sparkle::before,
    .sparkle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.98);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.96);
    }

    .sparkle::before {
      width: 2px;
      height: 100%;
    }

    .sparkle::after {
      width: 100%;
      height: 2px;
    }

    @keyframes twinkle {
      0%,
      100% {
        opacity: 0;
        transform: scale(0.35) rotate(0deg);
      }

      45% {
        opacity: 1;
        transform: scale(1.05) rotate(30deg);
      }

      58% {
        opacity: 0.72;
        transform: scale(0.72) rotate(45deg);
      }
    }

    /* ========================================
       レイアウト
    ======================================== */

    .app-shell {
      width: min(100%, 920px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        18px
        max(35px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 25px;
      padding: 0 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.52);
      box-shadow:
        0 12px 32px rgba(81, 144, 184, 0.13),
        inset 0 1px 0 #fff;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand-icon::after {
      content: "✦";
      position: absolute;
      right: -4px;
      top: -6px;
      color: #ffc96d;
      font-size: 18px;
      filter: drop-shadow(0 0 6px #fff);
      animation: iconTwinkle 2s ease-in-out infinite;
    }

    @keyframes iconTwinkle {
      50% {
        transform: rotate(25deg) scale(1.25);
      }
    }

    .mini-bunny {
      position: relative;
      width: 28px;
      height: 24px;
      margin-top: 8px;
      border-radius: 50% 50% 46% 46%;
      background: linear-gradient(145deg, #fff, #e5f5ff);
      box-shadow:
        inset -3px -3px 5px rgba(148, 193, 222, 0.23),
        0 4px 7px rgba(100, 158, 192, 0.16);
    }

    .mini-bunny::before,
    .mini-bunny::after {
      content: "";
      position: absolute;
      top: -13px;
      width: 9px;
      height: 20px;
      border-radius: 80% 80% 45% 45%;
      background: linear-gradient(145deg, #fff, #e6f6ff);
      box-shadow: inset 0 -4px 3px rgba(135, 192, 224, 0.15);
    }

    .mini-bunny::before {
      left: 3px;
      transform: rotate(-10deg);
    }

    .mini-bunny::after {
      right: 3px;
      transform: rotate(10deg);
    }

    .bunny-face {
      position: absolute;
      inset: 0;
    }

    .bunny-face::before {
      content: "•  •";
      position: absolute;
      top: 5px;
      left: 7px;
      color: #6188a4;
      font-size: 8px;
      letter-spacing: 4px;
    }

    .bunny-face::after {
      content: "ᵕ";
      position: absolute;
      top: 8px;
      left: 11px;
      color: #ef9ba7;
      font-size: 9px;
    }

    .brand-text small {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .brand-text strong {
      display: block;
      color: #344c65;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 4.8vw, 28px);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .today-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 999px;
      color: #5c7590;
      background: rgba(255, 255, 255, 0.5);
      box-shadow:
        0 10px 24px rgba(64, 134, 180, 0.1),
        inset 0 1px 0 #fff;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      gap: 22px;
      align-items: start;
    }

    .glass-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 32px;
      background:
        linear-gradient(
          140deg,
          rgba(255, 255, 255, 0.72),
          rgba(255, 255, 255, 0.38)
        );
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
    }

    .glass-card::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: -70px;
      left: -45px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.58);
      filter: blur(20px);
      pointer-events: none;
    }

    .input-card,
    .preview-card {
      padding: clamp(21px, 4.6vw, 32px);
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: #6f93ae;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: linear-gradient(90deg, #80bdf0, transparent);
    }

    h1 {
      margin: 0;
      color: #304a65;
      font-family: Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(29px, 6.8vw, 43px);
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: 0.015em;
    }

    .lead {
      margin: 15px 0 23px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.95;
    }

    .input-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
      color: #48627c;
      font-size: 13px;
      font-weight: 800;
    }

    .input-label span {
      color: #8ca0b3;
      font-size: 10px;
      font-weight: 600;
    }

    .memo-wrapper {
      position: relative;
    }

    #memo {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      padding: 19px 18px 55px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 23px;
      outline: none;
      color: #2f4962;
      background: rgba(250, 254, 255, 0.62);
      box-shadow:
        inset 0 2px 9px rgba(62, 127, 167, 0.06),
        0 11px 30px rgba(58, 126, 171, 0.06);
      caret-color: var(--blue-dark);
      line-height: 1.85;
      transition:
        border-color 0.25s,
        box-shadow 0.25s,
        transform 0.25s;
    }

    #memo:focus {
      border-color: rgba(104, 177, 239, 0.52);
      box-shadow:
        0 0 0 5px rgba(104, 177, 239, 0.12),
        inset 0 2px 9px rgba(62, 127, 167, 0.06),
        0 16px 38px rgba(58, 126, 171, 0.1);
      transform: translateY(-1px);
    }

    #memo::placeholder {
      color: #9cabb9;
    }

    .memo-helper {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 6px;
    }

    .helper-tag {
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 999px;
      color: #7c96aa;
      background: rgba(255, 255, 255, 0.54);
      font-size: 9px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(87, 142, 177, 0.06);
    }

    .example-row {
      display: flex;
      gap: 8px;
      margin-top: 13px;
      overflow-x: auto;
      padding: 1px 1px 6px;
      scrollbar-width: none;
    }

    .example-row::-webkit-scrollbar {
      display: none;
    }

    .example-button {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 999px;
      color: #668197;
      background: rgba(255, 255, 255, 0.43);
      box-shadow: 0 6px 15px rgba(74, 139, 181, 0.07);
      font-size: 10px;
      font-weight: 750;
      cursor: pointer;
      transition:
        transform 0.2s,
        background 0.2s;
    }

    .example-button:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.76);
    }

    .action-button {
      position: relative;
      width: 100%;
      min-height: 59px;
      margin-top: 17px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      color: #fff;
      background:
        linear-gradient(
          120deg,
          #81caff 0%,
          #67aff8 42%,
          #8fbcff 100%
        );
      box-shadow:
        0 14px 32px rgba(75, 155, 225, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
      font-size: 15px;
      font-weight: 850;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition:
        transform 0.22s,
        box-shadow 0.22s,
        filter 0.22s;
    }

    .action-button::before {
      content: "";
      position: absolute;
      inset: -50%;
      background:
        linear-gradient(
          110deg,
          transparent 35%,
          rgba(255, 255, 255, 0.6) 50%,
          transparent 65%
        );
      transform: translateX(-70%) rotate(8deg);
      animation: shine 4.4s ease-in-out infinite;
    }

    @keyframes shine {
      0%,
      65% {
        transform: translateX(-70%) rotate(8deg);
      }

      100% {
        transform: translateX(70%) rotate(8deg);
      }
    }

    .action-button:hover {
      filter: brightness(1.03);
      box-shadow:
        0 18px 40px rgba(75, 155, 225, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
      transform: translateY(-2px);
    }

    .action-button:active {
      transform: translateY(1px) scale(0.985);
    }

    .button-content {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .privacy-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 14px 3px 0;
      color: #899aa9;
      font-size: 10px;
      line-height: 1.65;
    }

    /* ========================================
       プレビュー
    ======================================== */

    .preview-card {
      min-height: 100%;
    }

    .preview-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 17px;
    }

    .preview-title small {
      display: block;
      margin-bottom: 5px;
      color: #8aa0b4;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
    }

    .preview-title h2 {
      margin: 0;
      color: #344e68;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 24px;
      font-weight: 500;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      color: #7890a3;
      background: rgba(255, 255, 255, 0.44);
      font-size: 9px;
      font-weight: 800;
    }

    .status-dot::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8cd6aa;
      box-shadow: 0 0 0 4px rgba(140, 214, 170, 0.14);
    }

    .event-sheet {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.47);
      box-shadow:
        0 18px 40px rgba(70, 129, 164, 0.09),
        inset 0 1px 0 #fff;
    }

    .event-row {
      display: grid;
      grid-template-columns: 43px 1fr;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid rgba(153, 186, 207, 0.21);
    }

    .event-row:last-child {
      border-bottom: 0;
    }

    .event-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.84);
      border-radius: 13px;
      color: #4c9aeb;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.9),
          rgba(218, 243, 255, 0.66)
        );
      box-shadow:
        0 8px 20px rgba(66, 139, 188, 0.1),
        inset 0 1px 0 #fff;
      font-size: 18px;
    }

    .event-info {
      min-width: 0;
    }

    .event-label {
      display: block;
      margin-bottom: 5px;
      color: #879bad;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.11em;
    }

    .event-value {
      overflow-wrap: anywhere;
      color: #354e67;
      font-size: 13px;
      font-weight: 720;
      line-height: 1.65;
    }

    .event-value.primary {
      color: #2d4862;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.45;
    }

    .event-value.date-value {
      color: #397fc5;
    }

    .event-description {
      max-height: 124px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-weight: 500;
    }

    .calendar-button {
      margin-top: 16px;
    }

    .calendar-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.15);
      transform: none;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .edit-field {
      min-width: 0;
    }

    .edit-field.full {
      grid-column: 1 / -1;
    }

    .edit-field label {
      display: block;
      margin: 0 0 6px 4px;
      color: #7890a3;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .edit-input {
      width: 100%;
      min-height: 43px;
      border: 1px solid rgba(255, 255, 255, 0.87);
      border-radius: 13px;
      outline: none;
      padding: 10px 11px;
      color: #405a72;
      background: rgba(255, 255, 255, 0.43);
      box-shadow: inset 0 1px 5px rgba(63, 127, 168, 0.05);
      font-size: 11px;
    }

    .edit-input:focus {
      border-color: rgba(91, 163, 225, 0.5);
      box-shadow: 0 0 0 4px rgba(104, 177, 239, 0.1);
    }

    .empty-message {
      padding: 45px 22px;
      text-align: center;
      color: #8ca0b1;
    }

    .empty-bunny {
      position: relative;
      width: 82px;
      height: 68px;
      margin: 22px auto 26px;
      border-radius: 50% 50% 44% 44%;
      background:
        radial-gradient(
          circle at 35% 25%,
          #fff,
          #f7fcff 50%,
          #d9f1ff 100%
        );
      box-shadow:
        0 18px 38px rgba(79, 150, 190, 0.15),
        inset -8px -8px 14px rgba(137, 196, 229, 0.15);
      animation: bunnyFloat 3.2s ease-in-out infinite;
    }

    @keyframes bunnyFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    .empty-bunny::before,
    .empty-bunny::after {
      content: "";
      position: absolute;
      top: -44px;
      width: 26px;
      height: 58px;
      border-radius: 70% 70% 35% 35%;
      background:
        linear-gradient(
          145deg,
          #fff,
          #e5f6ff
        );
      box-shadow:
        inset 0 -8px 10px rgba(131, 190, 224, 0.12),
        0 5px 12px rgba(70, 139, 180, 0.08);
    }

    .empty-bunny::before {
      left: 8px;
      transform: rotate(-8deg);
    }

    .empty-bunny::after {
      right: 8px;
      transform: rotate(8deg);
    }

    .empty-eyes {
      position: absolute;
      top: 28px;
      left: 21px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5b7d98;
      box-shadow: 33px 0 0 #5b7d98;
    }

    .empty-mouth {
      position: absolute;
      left: 35px;
      top: 38px;
      color: #ee9daf;
      font-size: 17px;
      line-height: 1;
    }

    .empty-star {
      position: absolute;
      right: -14px;
      top: -14px;
      color: #ffd480;
      font-size: 29px;
      filter: drop-shadow(0 0 7px #fff);
      animation: iconTwinkle 1.9s ease-in-out infinite;
    }

    .empty-message strong {
      display: block;
      margin-bottom: 8px;
      color: #5e7891;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 18px;
      font-weight: 500;
    }

    .empty-message p {
      margin: 0;
      font-size: 11px;
      line-height: 1.8;
    }

    /* ========================================
       トースト通知
    ======================================== */

    .toast {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px));
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 13px 17px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      color: #fff;
      background: rgba(52, 78, 104, 0.86);
      box-shadow:
        0 17px 40px rgba(30, 61, 85, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px) scale(0.96);
      transition:
        opacity 0.3s,
        transform 0.3s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    /* ========================================
       レスポンシブ
    ======================================== */

    @media (max-width: 760px) {
      .app-shell {
        padding-left: 14px;
        padding-right: 14px;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        margin-bottom: 18px;
      }

      .input-card,
      .preview-card {
        border-radius: 28px;
      }

      #memo {
        min-height: 195px;
      }
    }

    @media (max-width: 430px) {
      .today-chip {
        padding: 8px 10px;
        font-size: 10px;
      }

      .brand-icon {
        width: 46px;
        height: 46px;
        border-radius: 16px;

      .brand-text small {

      }

      .edit-grid {
        grid-template-columns: 1fr;
      }

      .edit-field.full {
        grid-column: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

                  class="edit-input"

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /* ========================================
       DOM取得
    ======================================== */

    const memoInput = document.getElementById("memo");
    const analyzeButton = document.getElementById("analyzeButton");
    const calendarButton = document.getElementById("calendarButton");

    const emptyState = document.getElementById("emptyState");
    const resultState = document.getElementById("resultState");

    const previewTitle = document.getElementById("previewTitle");
    const previewDate = document.getElementById("previewDate");
    const previewDescription =
      document.getElementById("previewDescription");

    const editTitle = document.getElementById("editTitle");
    const editDate = document.getElementById("editDate");
    const editStart = document.getElementById("editStart");
    const editEnd = document.getElementById("editEnd");

    const toast = document.getElementById("toast");
    const todayText = document.getElementById("todayText");

    let currentEvent = null;
    let toastTimer = null;

    /* ========================================
       初期化
    ======================================== */

    initialize();

    function initialize() {
      renderToday();
      createBubbles();
      createSparkles();
      bindEvents();
    }

    function bindEvents() {
      analyzeButton.addEventListener("click", analyzeMemo);
      calendarButton.addEventListener("click", downloadCalendarFile);

      document
        .querySelectorAll(".example-button")
        .forEach((button) => {
          button.addEventListener("click", () => {
            memoInput.value = button.dataset.example || "";
            memoInput.focus();
            showToast("入力例をセットしました ✦");
          });
        });

      [editTitle, editDate, editStart, editEnd].forEach((input) => {
        input.addEventListener("input", applyManualEdits);
      });

      memoInput.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          analyzeMemo();
        }
      });
    }

    /* ========================================
       日付表示
    ======================================== */

    function renderToday() {
      const today = new Date();

      todayText.textContent = new Intl.DateTimeFormat("ja-JP", {
        month: "short",
        day: "numeric",
        weekday: "short"
      }).format(today);
    }

    /* ========================================
       背景演出
    ======================================== */

    function createBubbles() {
      const container = document.getElementById("bubbles");

      for (let i = 0; i < 18; i += 1) {
        const bubble = document.createElement("span");
        bubble.className = "bubble";

        bubble.style.setProperty(
          "--size",
          `${randomNumber(14, 62)}px`
        );
        bubble.style.setProperty(
          "--left",
          `${randomNumber(1, 98)}%`
        );
        bubble.style.setProperty(
          "--duration",
          `${randomNumber(11, 25)}s`
        );
        bubble.style.setProperty(
          "--delay",
          `${randomNumber(-22, 0)}s`
        );

        container.appendChild(bubble);
      }
    }

    function createSparkles() {
      const container = document.getElementById("sparkles");

      for (let i = 0; i < 28; i += 1) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";

        sparkle.style.setProperty("--x", `${randomNumber(1, 99)}%`);
        sparkle.style.setProperty("--y", `${randomNumber(1, 99)}%`);
        sparkle.style.setProperty(
          "--spark-size",
          `${randomNumber(7, 20)}px`
        );
        sparkle.style.setProperty(
          "--speed",
          `${randomNumber(2, 5)}s`
        );
        sparkle.style.setProperty(
          "--delay",
          `${randomNumber(-5, 0)}s`
        );

        container.appendChild(sparkle);
      }
    }

    function randomNumber(min, max) {
      return Math.random() * (max - min) + min;
    }

    /* ========================================
       メモ解析
    ======================================== */

    function analyzeMemo() {
      const memo = normalizeText(memoInput.value);

      if (!memo) {
        showToast("予定のメモを入力してください");
        memoInput.focus();
        return;
      }

      try {
        const parsedDate = extractDate(memo);

        if (!parsedDate) {
          showToast("日付を見つけられませんでした");
          return;
        }

        const timeResult = extractTime(memo);
        const title = createEventTitle(memo);
        const description = createDescription(memo);

        const start = new Date(parsedDate);
        start.setHours(
          timeResult.startHour,
          timeResult.startMinute,
          0,
          0
        );

        const end = new Date(parsedDate);
        end.setHours(
          timeResult.endHour,
          timeResult.endMinute,
          0,
          0
        );

        /*
          終了時刻が開始時刻より前の場合は、
          日付をまたぐ予定として翌日に設定します。
        */
        if (end <= start) {
          end.setDate(end.getDate() + 1);
        }

        currentEvent = {
          title,
          description,
          start,
          end,
          isLongDay: timeResult.isLongDay
        };

        fillEditFields();
        renderPreview();
        showToast("予定を作成しました ✦");
      } catch (error) {
        console.error(error);
        showToast("予定を解析できませんでした");
      }
    }

    function normalizeText(value) {
      return String(value || "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .replace(/[ \t]+/g, " ")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    /* ========================================
       日付解析
    ======================================== */

    function extractDate(text) {
      const now = new Date();
      const today = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      if (/再来週/.test(text)) {
        const date = new Date(today);
        date.setDate(date.getDate() + 14);
        return date;
      }

      if (/来週/.test(text)) {
        const weekdayDate = extractWeekday(text, today, 7);

        if (weekdayDate) {
          return weekdayDate;
        }

        const date = new Date(today);
        date.setDate(date.getDate() + 7);
        return date;
      }

      if (/明後日|あさって/.test(text)) {
        const date = new Date(today);
        date.setDate(date.getDate() + 2);
        return date;
      }

      if (/明日|あした/.test(text)) {
        const date = new Date(today);
        date.setDate(date.getDate() + 1);
        return date;
      }

      if (/今日|きょう/.test(text)) {
        return today;
      }

      /*
        例：
        2026年8月10日
        2026/8/10
        2026-08-10
        26/8/10
      */
      const fullDateMatch = text.match(
        /(?:^|[^\d])(\d{2,4})\s*(?:年|[./-])\s*(\d{1,2})\s*(?:月|[./-])\s*(\d{1,2})\s*日?/
      );

      if (fullDateMatch) {
        let year = Number(fullDateMatch[1]);
        const month = Number(fullDateMatch[2]);
        const day = Number(fullDateMatch[3]);

        if (year < 100) {
          year += 2000;
        }

        return createValidatedDate(year, month, day);
      }

      /*
        例：
        8月10日
        8/10
        8-10
      */
      const shortDateMatch = text.match(
        /(?:^|[^\d])(\d{1,2})\s*(?:月|[./-])\s*(\d{1,2})\s*日?/
      );

      if (shortDateMatch) {
        const month = Number(shortDateMatch[1]);
        const day = Number(shortDateMatch[2]);
        let year = today.getFullYear();

        let date = createValidatedDate(year, month, day);

        if (!date) {
          return null;
        }

        /*
          年の記載がなく、指定日が大幅に過去なら翌年と判断。
          例：12月に「1月10日」と入力した場合など。
        */
        const difference =
          date.getTime() - today.getTime();

        const pastTolerance =
          -1000 * 60 * 60 * 24 * 90;

        if (difference < pastTolerance) {
          year += 1;
          date = createValidatedDate(year, month, day);
        }

        return date;
      }

      const weekdayDate = extractWeekday(text, today, 0);

      if (weekdayDate) {
        return weekdayDate;
      }

      return null;
    }

    function extractWeekday(text, baseDate, additionalDays) {
      const weekdayMap = {
        日: 0,
        月: 1,
        火: 2,
        水: 3,
        木: 4,
        金: 5,
        土: 6
      };

      const match = text.match(
        /(?:次の|今週の)?\s*([日月火水木金土])曜(?:日)?/
      );

      if (!match) {
        return null;
      }

      const targetWeekday = weekdayMap[match[1]];
      const date = new Date(baseDate);
      date.setDate(date.getDate() + additionalDays);

      let difference =
        (targetWeekday - date.getDay() + 7) % 7;

      /*
        「次の月曜日」なら、今日が月曜日でも7日後にする。
      */
      if (/次の/.test(match[0]) && difference === 0) {
        difference = 7;
      }

      date.setDate(date.getDate() + difference);
      return date;
    }

    function createValidatedDate(year, month, day) {
      if (
        !Number.isInteger(year) ||
        !Number.isInteger(month) ||
        !Number.isInteger(day)
      ) {
        return null;
      }

      if (month < 1 || month > 12 || day < 1 || day > 31) {
        return null;
      }

      const date = new Date(year, month - 1, day);

      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ) {
        return null;
      }

      return date;
    }

    /* ========================================
       時間解析
    ======================================== */

    function extractTime(text) {
      /*
        ユーザー指定：
        「終日」の場合は9:00～22:00
      */
      if (/終日|一日中|1日中/.test(text)) {
        return {
          startHour: 9,
          startMinute: 0,
          endHour: 22,
          endMinute: 0,
          isLongDay: true
        };
      }

      /*
        例：
        14:30～16:00
        14時30分から16時
        14時〜16時30分
      */
      const rangePatterns = [
        /(\d{1,2})[:時](\d{1,2})?\s*分?\s*(?:から|～|〜|~|-)\s*(\d{1,2})[:時](\d{1,2})?\s*分?/,
        /(\d{1,2})\s*時\s*(?:から|～|〜|~|-)\s*(\d{1,2})\s*時/
      ];

      for (const pattern of rangePatterns) {
        const match = text.match(pattern);

        if (!match) {
          continue;
        }

        if (match.length >= 5) {
          const startHour = clampHour(Number(match[1]));
          const startMinute = clampMinute(
            Number(match[2] || 0)
          );
          const endHour = clampHour(Number(match[3]));
          const endMinute = clampMinute(
            Number(match[4] || 0)
          );

          return {
            startHour,
            startMinute,
            endHour,
            endMinute,
            isLongDay: false
          };
        }

        const startHour = clampHour(Number(match[1]));
        const endHour = clampHour(Number(match[2]));

        return {
          startHour,
          startMinute: 0,
          endHour,
          endMinute: 0,
          isLongDay: false
        };
      }

      /*
        「午後3時」「午前10時30分」
      */
      const japanesePeriodMatch = text.match(
        /(午前|午後)\s*(\d{1,2})\s*(?:時|[:：])\s*(\d{1,2})?\s*分?/
      );

      if (japanesePeriodMatch) {
        const period = japanesePeriodMatch[1];
        let hour = Number(japanesePeriodMatch[2]);
        const minute = Number(japanesePeriodMatch[3] || 0);

        if (period === "午後" && hour < 12) {
          hour += 12;
        }

        if (period === "午前" && hour === 12) {
          hour = 0;
        }

        return oneHourSchedule(hour, minute);
      }

      /*
        「15:30」「15時30分」「15時」
      */
      const singleTimeMatch = text.match(
        /(?:^|[^\d])(\d{1,2})\s*(?:[:：時])\s*(\d{1,2})?\s*分?/
      );

      if (singleTimeMatch) {
        const hour = clampHour(Number(singleTimeMatch[1]));
        const minute = clampMinute(
          Number(singleTimeMatch[2] || 0)
        );

        return oneHourSchedule(hour, minute);
      }

      /*
        時間なしの場合は9:00～10:00
      */
      return {
        startHour: 9,
        startMinute: 0,
        endHour: 10,
        endMinute: 0,
        isLongDay: false
      };
    }

    function oneHourSchedule(hour, minute) {
      const start = new Date(2000, 0, 1, hour, minute);
      const end = new Date(start.getTime() + 60 * 60 * 1000);

      return {
        startHour: start.getHours(),
        startMinute: start.getMinutes(),
        endHour: end.getHours(),
        endMinute: end.getMinutes(),
        isLongDay: false
      };
    }

    function clampHour(value) {
      return Math.min(23, Math.max(0, value));
    }

    function clampMinute(value) {
      return Math.min(59, Math.max(0, value));
    }

    /* ========================================
       件名・内容生成
    ======================================== */

    function createEventTitle(text) {
      const lines = text
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);

      let candidate = lines[0] || "新しい予定";

      candidate = removeDateAndTime(candidate);

      /*
        文頭に残りやすい助詞や記号を削除
      */
      candidate = candidate
        .replace(/^[、。,.\s:：・\-～〜]+/, "")
        .replace(
          /^(に|は|で|から|まで|予定|予約)\s*/,
          ""
        )
        .trim();

      /*
        句点や詳細説明の前までを件名候補にする
      */
      candidate = candidate
        .split(/[。！!？?\n]/)[0]
        .trim();

      /*
        「〜する」「〜へ行く」などを自然な件名に寄せる
      */
      candidate = candidate
        .replace(/^予定[:：]\s*/, "")
        .replace(/^件名[:：]\s*/, "")
        .replace(/する予定$/, "")
        .trim();

      if (!candidate) {
        const keywordTitle = detectKeywordTitle(text);

        if (keywordTitle) {
          return keywordTitle;
        }

        return "新しい予定";
      }

      if (candidate.length > 34) {
        candidate = `${candidate.slice(0, 34)}…`;
      }

      return candidate;
    }

    function detectKeywordTitle(text) {
      const titleRules = [
        [/美容院|ヘアサロン|カット|カラー/, "美容院"],
        [/病院|クリニック|診察|通院/, "病院の予定"],
        [/歯医者|歯科/, "歯医者"],
        [/会議|ミーティング|打ち合わせ/, "ミーティング"],
        [/面接/, "面接"],
        [/誕生日/, "誕生日"],
        [/旅行|ホテル|旅館/, "旅行"],
        [/ライブ|コンサート/, "ライブ"],
        [/食事|ディナー|ランチ/, "食事の予定"],
        [/買い物/, "買い物"],
        [/締切|提出/, "提出期限"]
      ];

      for (const [pattern, title] of titleRules) {
        if (pattern.test(text)) {
          return title;
        }
      }

      return "";
    }

    function createDescription(text) {
      const cleaned = text
        .replace(/\n{3,}/g, "\n\n")
        .trim();

      return cleaned || "メモから作成した予定です。";
    }

    function removeDateAndTime(text) {
      return text
        .replace(
          /\d{2,4}\s*(?:年|[./-])\s*\d{1,2}\s*(?:月|[./-])\s*\d{1,2}\s*日?/g,
          ""
        )
        .replace(
          /\d{1,2}\s*(?:月|[./-])\s*\d{1,2}\s*日?/g,
          ""
        )
        .replace(
          /(?:今日|きょう|明日|あした|明後日|あさって|来週|再来週)/g,
          ""
        )
        .replace(
          /(?:次の|今週の)?\s*[日月火水木金土]曜(?:日)?/g,
          ""
        )
        .replace(
          /(午前|午後)\s*\d{1,2}\s*(?:時|[:：])\s*\d{0,2}\s*分?/g,
          ""
        )
        .replace(
          /\d{1,2}\s*(?:[:：時])\s*\d{0,2}\s*分?\s*(?:から|～|〜|~|-)\s*\d{1,2}\s*(?:[:：時])\s*\d{0,2}\s*分?/g,
          ""
        )
        .replace(
          /\d{1,2}\s*(?:[:：時])\s*\d{0,2}\s*分?/g,
          ""
        )
        .replace(/終日|一日中|1日中/g, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    /* ========================================
       プレビュー表示
    ======================================== */

    function renderPreview() {
      if (!currentEvent) {
        return;
      }

      emptyState.hidden = true;
      resultState.hidden = false;

      previewTitle.textContent = currentEvent.title;
      previewDescription.textContent =
        currentEvent.description;

      previewDate.textContent = formatDisplayDate(
        currentEvent.start,
        currentEvent.end
      );
    }

    function formatDisplayDate(start, end) {
      const dateText = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(start);

      const startTime = formatTime(start);
      const endTime = formatTime(end);

      return `${dateText}　${startTime} ～ ${endTime}`;
    }

    function formatTime(date) {
      return [
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0")
      ].join(":");
    }

    function fillEditFields() {
      if (!currentEvent) {
        return;
      }

      editTitle.value = currentEvent.title;
      editDate.value = formatDateInput(currentEvent.start);
      editStart.value = formatTime(currentEvent.start);
      editEnd.value = formatTime(currentEvent.end);
    }

    function formatDateInput(date) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function applyManualEdits() {
      if (!currentEvent || !editDate.value) {
        return;
      }

      const [year, month, day] =
        editDate.value.split("-").map(Number);

      const [startHour, startMinute] =
        (editStart.value || "09:00")
          .split(":")
          .map(Number);

      const [endHour, endMinute] =
        (editEnd.value || "10:00")
          .split(":")
          .map(Number);

      const start = new Date(
        year,
        month - 1,
        day,
        startHour,
        startMinute,
        0,
        0
      );

      const end = new Date(
        year,
        month - 1,
        day,
        endHour,
        endMinute,
        0,
        0
      );

      if (end <= start) {
        end.setDate(end.getDate() + 1);
      }

      currentEvent.title =
        editTitle.value.trim() || "新しい予定";
      currentEvent.start = start;
      currentEvent.end = end;

      renderPreview();
    }

    /* ========================================
       iCalendarファイル生成
    ======================================== */

    function downloadCalendarFile() {
      if (!currentEvent) {
        showToast("先に予定を作成してください");
        return;
      }

      applyManualEdits();

      try {
        const icsContent = createICS(currentEvent);

        const blob = new Blob(
          [icsContent],
          {
            type: "text/calendar;charset=utf-8"
          }
        );

        const objectURL = URL.createObjectURL(blob);
        const fileName =
          sanitizeFileName(currentEvent.title) + ".ics";

        const anchor = document.createElement("a");
        anchor.href = objectURL;
        anchor.download = fileName;
        anchor.style.display = "none";

        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();

        /*
          iOS Safariではダウンロード属性の挙動が異なる場合があるため、
          少し時間を置いてURLを解放します。
        */
        window.setTimeout(() => {
          URL.revokeObjectURL(objectURL);
        }, 5000);

        showToast(
          "カレンダーファイルを作成しました。表示された予定を追加してください ✦"
        );
      } catch (error) {
        console.error(error);
        showToast("カレンダーファイルを作成できませんでした");
      }
    }

    function createICS(eventData) {
      const uid =
        `${Date.now()}-${Math.random()
          .toString(36)
          .slice(2)}@lumi-calendar.local`;

      const createdAt = formatICSUTC(new Date());
      const start = formatICSLocal(eventData.start);
      const end = formatICSLocal(eventData.end);

      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Lumi Calendar//Memo Calendar//JA",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VTIMEZONE",
        "TZID:Asia/Tokyo",
        "X-LIC-LOCATION:Asia/Tokyo",
        "BEGIN:STANDARD",
        "TZOFFSETFROM:+0900",
        "TZOFFSETTO:+0900",
        "TZNAME:JST",
        "DTSTART:19700101T000000",
        "END:STANDARD",
        "END:VTIMEZONE",
        "BEGIN:VEVENT",
        `UID:${escapeICS(uid)}`,
        `DTSTAMP:${createdAt}`,
        `DTSTART;TZID=Asia/Tokyo:${start}`,
        `DTEND;TZID=Asia/Tokyo:${end}`,
        `SUMMARY:${escapeICS(eventData.title)}`,
        `DESCRIPTION:${escapeICS(eventData.description)}`,
        "STATUS:CONFIRMED",
        "TRANSP:OPAQUE",
        "BEGIN:VALARM",
        "TRIGGER:-PT30M",
        "ACTION:DISPLAY",
        `DESCRIPTION:${escapeICS(eventData.title)}`,
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      ];

      /*
        iCalendarはCRLF改行を使用
      */
      return lines.join("\r\n");
    }

    function formatICSLocal(date) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0"),
        "T",
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0"),
        String(date.getSeconds()).padStart(2, "0")
      ].join("");
    }

    function formatICSUTC(date) {
      return [
        date.getUTCFullYear(),
        String(date.getUTCMonth() + 1).padStart(2, "0"),
        String(date.getUTCDate()).padStart(2, "0"),
        "T",
        String(date.getUTCHours()).padStart(2, "0"),
        String(date.getUTCMinutes()).padStart(2, "0"),
        String(date.getUTCSeconds()).padStart(2, "0"),
        "Z"
      ].join("");
    }

    function escapeICS(value) {
      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/\r?\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
    }

    function sanitizeFileName(value) {
      const safeName = String(value || "calendar-event")
        .replace(/[\\/:*?"<>|]/g, "")
        .replace(/\s+/g, "_")
        .slice(0, 50);

      return safeName || "calendar-event";
    }

    /* ========================================
       トースト
    ======================================== */

    function showToast(message) {
      window.clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.add("show");

      toastTimer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 3200);
    }
  </script>
</body>
