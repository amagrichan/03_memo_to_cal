<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふわっとメモカレンダー</title>
  <!-- Google Fonts: 綺麗で可読性の高いフォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome アイコン -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      /* プロ仕様のクリア＆エアリーパレット */
      --bg-gradient: radial-gradient(100% 100% at 50% 0%, #e0f2fe 0%, #f0f9ff 50%, #ffffff 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.9);
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text-main: #1e293b;
      --text-sub: #64748b;
      --input-bg: rgba(248, 250, 252, 0.8);
    }

    * {
      box-sizing: border-box;
      font-family: 'M PLUS Rounded 1c', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* 背景：プロ感のある静かで繊細なキラキラ背景 */
    .sparkle-bg {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(186, 230, 253, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 8s infinite ease-in-out alternate;
    }
    .sparkle-1 { width: 300px; height: 300px; top: -50px; left: -50px; }
    .sparkle-2 { width: 400px; height: 400px; bottom: -100px; right: -80px; animation-delay: -4s; }

    @keyframes floatGlow {
      0% { transform: scale(1) translateY(0); opacity: 0.5; }
      100% { transform: scale(1.15) translateY(-20px); opacity: 0.8; }
    }

    /* 繊細な光のモチーフアイコン */
    .magic-star {
      position: absolute;
      color: #7dd3fc;
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 0;
      animation: pulseStar 3s infinite ease-in-out alternate;
      filter: drop-shadow(0 0 6px rgba(125, 211, 252, 0.8));
    }
    @keyframes pulseStar {
      0% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
      100% { opacity: 1; transform: scale(1.2) rotate(15deg); }
    }

    /* ヘッダーデザイン */
    .header {
      text-align: center;
      margin-bottom: 28px;
      z-index: 1;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(186, 230, 253, 0.8);
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary-dark);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .header h1 {
      font-size: clamp(1.5rem, 4.5vw, 1.85rem);
      color: #0c4a6e;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    /* メインコンテナ（グラスモーフィズム） */
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 32px;
      padding: clamp(24px, 5vw, 32px);
      box-shadow: 
        0 20px 40px -15px rgba(14, 165, 233, 0.12),
        0 0 0 1px var(--card-border) inset;
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 1;
    }

    /* 【右上モチーフ】文字なし・洗練されたジュエル/魔法アクセント */
    .magic-jewel-badge {
      position: absolute;
      top: -20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 100%);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        0 8px 20px rgba(56, 189, 248, 0.25),
        inset 0 0 10px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      color: var(--primary);
      transform: rotate(6deg);
      transition: transform 0.3s ease;
      animation: floatBadge 4s infinite ease-in-out alternate;
    }

    @keyframes floatBadge {
      0% { transform: rotate(6deg) translateY(0); }
      100% { transform: rotate(-4deg) translateY(-6px); }
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 14px 16px;
      border: 1.5px solid #e0f2fe;
      border-radius: 20px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: var(--input-bg);
      outline: none;
      transition: all 0.25s ease;
      resize: vertical;
      font-weight: 500;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    textarea:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    /* メインボタン */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 20px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.02em;
    }

    .btn-parse {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
    }

    .btn-parse:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(2, 132, 199, 0.35);
      filter: brightness(1.03);
    }

    .btn-parse:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }

    /* 結果プレビューカード */
    .preview-card {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e0f2fe;
      border-radius: 24px;
      padding: 20px;
      display: none;
      box-shadow: 0 10px 25px rgba(186, 230, 253, 0.3);
      animation: cardSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardSlideUp {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .preview-card h2 {
      margin-top: 0;
      font-size: 1.02rem;
      color: #0369a1;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 10px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid #f1f5f9;
    }

    .field-label {
      font-size: 0.72rem;
      color: #0284c7;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .field-value {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 700;
      word-break: break-all;
      margin-top: 2px;
    }

    .calendar-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-apple {
      background: #0284c7;
      color: #ffffff;
    }

    .btn-timetree {
      background: #10b981;
      color: #ffffff;
    }

    .btn-apple:hover, .btn-timetree:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .tip-box {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-sub);
      background: rgba(240, 249, 255, 0.5);
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.5;
      border: 1px solid #e0f2fe;
    }

    /* トースト通知 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0f172a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 700;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<!-- 背景の柔らかな光と輝き -->
<div class="sparkle-bg sparkle-1"></div>
<div class="sparkle-bg sparkle-2"></div>

<i class="fa-solid fa-sparkles magic-star" style="top: 12%; left: 15%; animation-delay: 0s;"></i>
<i class="fa-solid fa-star magic-star" style="top: 22%; right: 15%; font-size: 0.7rem; animation-delay: 1.2s;"></i>
<i class="fa-solid fa-sparkles magic-star" style="bottom: 15%; left: 12%; font-size: 1.1rem; animation-delay: 2.1s;"></i>

<!-- ヘッダー -->
<div class="header">
  <div class="header-badge">
    <i class="fa-solid fa-wand-magic-sparkles"></i> AI Smart Calendar Sync
  </div>
  <h1>メモから、一瞬でカレンダーへ</h1>
</div>

<div class="container">

  <!-- 右上アクセントモチーフ（文字なし・洗練デザイン） -->
  <div class="magic-jewel-badge">
    <i class="fa-solid fa-wand-magic"></i>
  </div>

  <div class="input-group">
    <label for="memoInput"><i class="fa-solid fa-pen-nib"></i> 予定テキストを入力</label>
    <textarea id="memoInput" placeholder="例：&#10;明日 終日 ディズニー行く！&#10;または&#10;8月10日 15:00 カフェで打ち合わせ"></textarea>
  </div>

  <button class="btn btn-parse" id="parseBtn" onclick="parseMemo()">
    <i class="fa-solid fa-wand-magic-sparkles"></i> 予定を魔法でまとめる
  </button>

  <!-- 結果カード -->
  <div id="previewCard" class="preview-card">
    <h2><i class="fa-solid fa-circle-check" style="color: #38bdf8;"></i> 解析完了</h2>
    
    <div class="field">
      <div class="field-label"><i class="fa-regular fa-clock"></i> 日時</div>
      <div class="field-value" id="resDateTime">-</div>
    </div>

    <div class="field">
      <div class="field-label"><i class="fa-solid fa-bookmark"></i> 件名</div>
      <div class="field-value" id="resTitle">-</div>
    </div>

    <div class="field">
      <div class="field-label"><i class="fa-solid fa-bars-staggered"></i> 詳細メモ</div>
      <div class="field-value" id="resBody" style="white-space: pre-wrap; font-weight: 500;">-</div>
    </div>

    <div class="calendar-actions">
      <button class="btn btn-apple" onclick="downloadICS()">
        <i class="fa-brands fa-apple"></i> Appleカレンダーに追加 (.ics)
      </button>

      <button class="btn btn-timetree" onclick="openTimeTree()">
        <i class="fa-solid fa-tree"></i> TimeTreeに追加（コピー＆起動）
      </button>
    </div>

    <div class="tip-box">
      <strong>💡 アプリ連携のポイント</strong><br>
      • <strong>Appleカレンダー:</strong> ファイルが開いたら「すべて追加」をタップ。<br>
      • <strong>TimeTree:</strong> クリップボードの内容を新規作成画面へ貼り付けてご利用ください。
    </div>
  </div>
</div>

<div id="toast" class="toast">✨ テキストをコピーしました</div>

<script>
let parsedEvent = null;

// ===============================================
// 🌐 API連携設定（サーバー連携時に設定）
// ===============================================
const API_CONFIG = {
  endpoint: '', // 例: '/api/parse-memo'
  useAPI: false // 有効化する場合は true に設定
};

async function parseMemo() {
  const text = document.getElementById('memoInput').value.trim();
  if (!text) {
    alert('メモを入力してください');
    return;
  }

  const btn = document.getElementById('parseBtn');
  btn.style.pointerEvents = 'none';
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 解析中...';

  try {
    if (API_CONFIG.useAPI && API_CONFIG.endpoint) {
      parsedEvent = await parseWithAPI(text);
    } else {
      parsedEvent = parseLocalMemo(text);
    }

    updatePreviewUI(parsedEvent);
  } catch (error) {
    console.error('API Error:', error);
    parsedEvent = parseLocalMemo(text);
    updatePreviewUI(parsedEvent);
  } finally {
    btn.style.pointerEvents = 'auto';
    btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> 予定を魔法でまとめる';
  }
}

// API呼び出し関数
async function parseWithAPI(text) {
  const response = await fetch(API_CONFIG.endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ memo: text })
  });

  if (!response.ok) throw new Error('API Error');
  const data = await response.json();

  const startDate = new Date(data.year, data.month - 1, data.day, data.startHour, data.startMinute);
  const endDate = new Date(data.year, data.month - 1, data.day, data.endHour, data.endMinute);

  return {
    start: startDate,
    end: endDate,
    year: data.year,
    month: data.month,
    day: data.day,
    startHour: data.startHour,
    startMinute: data.startMinute,
    endHour: data.endHour,
    endMinute: data.endMinute,
    isAllDay: data.isAllDay || false,
    title: data.title,
    description: data.description
  };
}

// ローカルでの高精度ルール解析
function parseLocalMemo(text) {
  const now = new Date();
  let year = now.getFullYear();
  let month = now.getMonth() + 1;
  let day = now.getDate();
  
  let startHour = 9;
  let startMinute = 0;
  let endHour = 10;
  let endMinute = 0;
  let isAllDay = false;

  // 日付の判定
  if (text.includes('明日') || text.includes('あした')) {
    const tomorrow = new Date(now);
    tomorrow.setDate(now.getDate() + 1);
    year = tomorrow.getFullYear();
    month = tomorrow.getMonth() + 1;
    day = tomorrow.getDate();
  } else if (text.includes('明後日') || text.includes('あさって')) {
    const dayAfter = new Date(now);
    dayAfter.setDate(now.getDate() + 2);
    year = dayAfter.getFullYear();
    month = dayAfter.getMonth() + 1;
    day = dayAfter.getDate();
  } else {
    const fullDateMatch = text.match(/(\d{4})[\/\.-年](\d{1,2})[\/\.-月](\d{1,2})/);
    const shortDateMatch = text.match(/(\d{1,2})[\/\.-月](\d{1,2})日?/);

    if (fullDateMatch) {
      year = parseInt(fullDateMatch[1]);
      month = parseInt(fullDateMatch[2]);
      day = parseInt(fullDateMatch[3]);
    } else if (shortDateMatch) {
      month = parseInt(shortDateMatch[1]);
      day = parseInt(shortDateMatch[2]);
    }
  }

  // 時間の判定ルール（記載あり ➔ 指定時間 / 終日 ➔ 9〜22時 / なし ➔ 9〜10時）
  const timeMatch = text.match(/(\d{1,2})[:：](\d{2})/) || text.match(/(\d{1,2})時((\d{1,2})分)?/);

  if (text.includes('終日')) {
    startHour = 9;
    startMinute = 0;
    endHour = 22;
    endMinute = 0;
    isAllDay = true;
  } else if (timeMatch) {
    startHour = parseInt(timeMatch[1]);
    if (timeMatch[2] && !timeMatch[2].includes('分')) {
      startMinute = parseInt(timeMatch[2]);
    } else if (timeMatch[3]) {
      startMinute = parseInt(timeMatch[3]);
    }
    endHour = startHour + 1;
    endMinute = startMinute;
  } else {
    startHour = 9;
    startMinute = 0;
    endHour = 10;
    endMinute = 0;
  }

  // タイトルの抽出
  const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
  let titleText = lines[0] || '新規予定';
  titleText = titleText
    .replace(/(\d{4}[\/\.-年])?\d{1,2}[\/\.-月]\d{1,2}日?/, '')
    .replace(/(\d{1,2}[:：]\d{2}|\d{1,2}時(\d{1,2}分)?)/, '')
    .replace(/(明日|あした|明後日|あさって|今日|終日)/g, '')
    .trim();

  if (!titleText) titleText = '予定';

  const description = lines.length > 1 ? lines.slice(1).join('\n') : text;

  const startDate = new Date(year, month - 1, day, startHour, startMinute);
  const endDate = new Date(year, month - 1, day, endHour, endMinute);

  return {
    start: startDate,
    end: endDate,
    year, month, day, startHour, startMinute, endHour, endMinute, isAllDay,
    title: titleText,
    description: description
  };
}

function updatePreviewUI(event) {
  const pad = n => String(n).padStart(2, '0');
  const timeDisplay = event.isAllDay 
    ? `${event.year}年${event.month}月${event.day}日 09:00 〜 22:00 (終日)`
    : `${event.year}年${event.month}月${event.day}日 ${pad(event.startHour)}:${pad(event.startMinute)} 〜 ${pad(event.endHour)}:${pad(event.endMinute)}`;

  document.getElementById('resDateTime').textContent = timeDisplay;
  document.getElementById('resTitle').textContent = event.title;
  document.getElementById('resBody').textContent = event.description;

  document.getElementById('previewCard').style.display = 'block';
}

function formatDateToICS(date) {
  return date.toISOString().replace(/-|:|\.\d\d\d/g, '');
}

function downloadICS() {
  if (!parsedEvent) return;

  const icsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Smart Memo Calendar//JA
BEGIN:VEVENT
SUMMARY:${parsedEvent.title}
DESCRIPTION:${parsedEvent.description.replace(/\n/g, '\\n')}
DTSTART:${formatDateToICS(parsedEvent.start)}
DTEND:${formatDateToICS(parsedEvent.end)}
END:VEVENT
END:VCALENDAR`;

  const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${parsedEvent.title}.ics`;
  a.click();
  URL.revokeObjectURL(url);
}

function openTimeTree() {
  if (!parsedEvent) return;

  const pad = n => String(n).padStart(2, '0');
  const copyText = `【${parsedEvent.title}】\n日時: ${parsedEvent.year}/${parsedEvent.month}/${parsedEvent.day} ${pad(parsedEvent.startHour)}:${pad(parsedEvent.startMinute)}～${pad(parsedEvent.endHour)}:${pad(parsedEvent.endMinute)}\n\nメモ:\n${parsedEvent.description}`;

  navigator.clipboard.writeText(copyText).then(() => {
    showToast('✨ コピーしました！TimeTreeを開きます');
    setTimeout(() => {
      window.location.href = 'timetree://';
      setTimeout(() => {
        window.location.href = 'https://timetreeapp.com/';
      }, 1500);
    }, 800);
  }).catch(() => {
    alert('コピーに失敗しました');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>

</body>
</html>
