<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆめふわスケジュール登録</title>
  
  <!-- iPhone「ホーム画面に追加」時のアイコン設定 -->
  <link rel="apple-touch-icon" href="bunny.png">
  <link rel="icon" href="bunny.png">

  <!-- Google Fonts（丸みのあるかわいいフォント） -->
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #e0f7fa;
      --card-bg: rgba(255, 255, 255, 0.85);
      --primary-color: #81d4fa;
      --accent-color: #b3e5fc;
      --text-color: #5c6bc0;
      --btn-color: #b2ebf2;
      --btn-hover: #80deea;
    }

    * {
      box-sizing: border-box;
      font-family: 'Kiwi Maru', serif;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f7fa 0%, #fff0f5 50%, #e1f5fe 100%);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 25px 20px;
      box-shadow: 0 10px 25px rgba(129, 212, 250, 0.3), 0 0 20px rgba(255, 255, 255, 0.8);
      border: 3px solid #ffffff;
      position: relative;
    }

    /* うさぎ画像エリア */
    .header-img {
      text-align: center;
      margin-bottom: 10px;
    }

    .header-img img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      color: #4dd0e1;
      margin: 0 0 15px 0;
      text-shadow: 1px 1px 2px #fff;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 5px;
      display: block;
      color: #5c6bc0;
    }

    textarea {
      width: 100%;
      height: 110px;
      border: 2px solid #b2ebf2;
      border-radius: 20px;
      padding: 12px;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.9);
      color: #3f51b5;
      outline: none;
      resize: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      transition: border-color 0.3s;
    }

    textarea:focus {
      border-color: #4dd0e1;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(129, 212, 250, 0.4);
    }

    .parse-btn {
      background: linear-gradient(135deg, #b2ebf2, #81d4fa);
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .parse-btn:active {
      transform: scale(0.98);
    }

    /* 抽出結果フォーム */
    .result-card {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 15px;
      border: 2px dashed #b2ebf2;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .inline-inputs {
      display: flex;
      gap: 10px;
    }

    .inline-inputs .form-group {
      flex: 1;
    }

    input[type="text"], input[type="date"], input[type="time"] {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #e0f7fa;
      border-radius: 12px;
      font-size: 0.9rem;
      background: #fbfdfe;
      color: #303f9f;
      outline: none;
    }

    input:focus {
      border-color: #81d4fa;
    }

    .add-cal-btn {
      width: 100%;
      margin-top: 15px;
      background: linear-gradient(135deg, #a7ffeb, #80deea);
      color: #004d40;
      font-weight: bold;
    }

    .add-cal-btn:disabled {
      background: #e0e0e0;
      color: #9e9e9e;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-img">
      <!-- 同階層の bunny.png を読み込み -->
      <img src="bunny.png" alt="bunny" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'90\' height=\'90\' viewBox=\'0 0 90 90\'><circle cx=\'45\' cy=\'45\' r=\'45\' fill=\'%23b2ebf2\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%235c6bc0\' font-size=\'12\'>bunny.png</text></svg>'">
    </div>

    <h1>☁️ スケジュール抽出 ☁️</h1>

    <label for="memoInput">メモを入力してね ♪</label>
    <textarea id="memoInput" placeholder="例：明日 14時からカフェでミーティング。資料を準備すること。"></textarea>

    <div class="btn-group">
      <button class="parse-btn" onclick="parseMemo()">✨ 内容を抽出する</button>
    </div>

    <div class="result-card">
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="eventDate">
      </div>

      <div class="inline-inputs">
        <div class="form-group">
          <label>開始時間</label>
          <input type="time" id="startTime">
        </div>
        <div class="form-group">
          <label>終了時間</label>
          <input type="time" id="endTime">
        </div>
      </div>

      <div class="form-group">
        <label>件名</label>
        <input type="text" id="eventTitle" placeholder="件名">
      </div>

      <div class="form-group">
        <label>詳細</label>
        <input type="text" id="eventDetail" placeholder="詳細メモ">
      </div>

      <button class="add-cal-btn" id="addBtn" onclick="addToCalendar()" disabled>📅 iPhoneカレンダーに追加</button>
    </div>
  </div>

  <script>
    // メモからの情報解析ロジック
    function parseMemo() {
      const text = document.getElementById('memoInput').value;
      if (!text.trim()) return;

      const now = new Date();
      let targetDate = new Date();
      let hasDateMatch = false;

      // 1. 日付の判定
      if (text.includes('今日')) {
        targetDate = new Date();
        hasDateMatch = true;
      } else if (text.includes('明日')) {
        targetDate.setDate(now.getDate() + 1);
        hasDateMatch = true;
      } else if (text.includes('明後日')) {
        targetDate.setDate(now.getDate() + 2);
        hasDateMatch = true;
      } else {
        // 「M月D日」または「M/D」のパターン
        const dateMatch = text.match(/(?:(\d{1,2})[月\/])?(\d{1,2})日?/);
        if (dateMatch) {
          let month = dateMatch[1] ? parseInt(dateMatch[1]) - 1 : now.getMonth();
          let day = parseInt(dateMatch[2]);
          
          // 年越し考慮（過去月なら翌年扱い）
          let year = now.getFullYear();
          if (dateMatch[1] && month < now.getMonth()) {
            year += 1;
          }
          targetDate = new Date(year, month, day);
          hasDateMatch = true;
        }
      }

      // フォーマット調整 (YYYY-MM-DD)
      const yyyy = targetDate.getFullYear();
      const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
      const dd = String(targetDate.getDate()).padStart(2, '0');
      document.getElementById('eventDate').value = `${yyyy}-${mm}-${dd}`;

      // 2. 時刻の判定
      let startStr = "09:00";
      let endStr = "10:00";

      if (text.includes('終日')) {
        // 補足仕様：終日の場合は朝7時〜22時
        startStr = "07:00";
        endStr = "22:00";
      } else {
        // 「14:00」「14時」「14時30分」などを抽出
        const timeMatches = [...text.matchAll(/(\d{1,2})(?:[:：](\d{2}))? ?[時:]?(?:(\d{1,2})分?)?/g)]
          .filter(m => m[1] && parseInt(m[1]) <= 24);

        if (timeMatches.length >= 2) {
          // 2つ時刻があれば開始・終了とみなす
          startStr = formatTime(timeMatches[0][1], timeMatches[0][2] || timeMatches[0][3]);
          endStr = formatTime(timeMatches[1][1], timeMatches[1][2] || timeMatches[1][3]);
        } else if (timeMatches.length === 1) {
          // 1つだけなら1時間枠にする
          let h = parseInt(timeMatches[0][1]);
          let m = timeMatches[0][2] || timeMatches[0][3] || "0";
          startStr = formatTime(h, m);
          endStr = formatTime(h + 1, m);
        }
      }

      document.getElementById('startTime').value = startStr;
      document.getElementById('endTime').value = endStr;

      // 3. 件名と詳細の抽出
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length > 0) {
        document.getElementById('eventTitle').value = lines[0].substring(0, 30);
        document.getElementById('eventDetail').value = lines.slice(1).join(' ') || text;
      } else {
        document.getElementById('eventTitle').value = text.substring(0, 20);
        document.getElementById('eventDetail').value = text;
      }

      document.getElementById('addBtn').disabled = false;
    }

    function formatTime(h, m) {
      const hh = String(h).padStart(2, '0');
      const mm = String(m || 0).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    // iPhoneカレンダー連携（.ics形式ファイルの動的生成・ダウンロード）
    function addToCalendar() {
      const dateVal = document.getElementById('eventDate').value;
      const startVal = document.getElementById('startTime').value;
      const endVal = document.getElementById('endTime').value;
      const title = document.getElementById('eventTitle').value || "予定";
      const detail = document.getElementById('eventDetail').value || "";

      if (!dateVal) return;

      // iCalendarフォーマット用文字列整形 (YYYYMMDDTHHMMSS)
      const startDateStr = dateVal.replace(/-/g, '') + 'T' + startVal.replace(':', '') + '00';
      const endDateStr = dateVal.replace(/-/g, '') + 'T' + endVal.replace(':', '') + '00';

      const icsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Yumefuwa Calendar App//NONSGML v1.0//EN
BEGIN:VEVENT
SUMMARY:${title}
DESCRIPTION:${detail}
DTSTART:${startDateStr}
DTEND:${endDateStr}
END:VEVENT
END:VCALENDAR`;

      // blob生成してダウンロード発動（iOSのSafariが開くと直接カレンダー追加画面になります）
      const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'event.ics';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
