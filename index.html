<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆめふわ スケジュール登録</title>
    <style>
        /* 全体スタイル（水色×白のふわふわグラデーション） */
        body {
            margin: 0;
            padding: 40px 20px 20px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 50%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
            color: #4b5563;
        }

        .container {
            position: relative; /* うさぎを右上枠外に配置するための親要素基準 */
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 枠外右上に配置するうさぎちゃんイラスト（元の80%サイズ） */
        .bunny-badge {
            position: absolute;
            top: -45px;
            right: -15px;
            width: 110px; /* 140pxの約80%サイズ */
            height: auto;
            z-index: 10;
            filter: drop-shadow(0 6px 10px rgba(147, 197, 253, 0.4));
            animation: float 3s ease-in-out infinite;
            pointer-events: none; /* 入力やボタン操作の邪魔にならないように設定 */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(3deg); }
            50% { transform: translateY(-6px) rotate(-2deg); }
        }

        /* ヘッダー */
        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 20px;
            color: #60a5fa;
            margin: 0;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* カードのベースデザイン */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(191, 219, 254, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #93c5fd;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 入力フォーム */
        textarea, input {
            width: 100%;
            border: 1.5px solid #bae6fd;
            border-radius: 16px;
            padding: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #374151;
            transition: all 0.2s ease;
        }

        textarea:focus, input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.3);
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .field-group {
            margin-bottom: 12px;
        }

        .field-group label {
            font-size: 12px;
            color: #9ca3af;
            display: block;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        /* ふわふわボタン */
        .btn {
            width: 100%;
            border: none;
            border-radius: 20px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #7dd3fc 0%, #a5b4fc 100%);
            box-shadow: 0 6px 15px rgba(165, 180, 252, 0.4);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-add {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            box-shadow: 0 6px 15px rgba(129, 140, 248, 0.4);
        }

        /* 解析結果（最初は非表示） */
        #resultCard {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 枠外右上に表示するうさぎイラスト -->
        <img src="bunny1.png" alt="うさぎちゃん" class="bunny-badge">

        <!-- ヘッダーエリア -->
        <div class="header">
            <h1>ゆめふわ スケジュール登録</h1>
        </div>

        <!-- メモ入力エリア -->
        <div class="card">
            <div class="section-title">✨ メモを入力してね</div>
            <textarea id="memoInput" placeholder="例：明日 15:00 渋谷でカフェミーティング"></textarea>
            <button class="btn" onclick="parseMemo()">予定を読み取る 🪄</button>
        </div>

        <!-- 解析＆確認エリア -->
        <div class="card" id="resultCard">
            <div class="section-title" style="color: #818cf8;">🌸 抽出結果</div>
            
            <div class="field-group">
                <label for="titleInput">件名</label>
                <input type="text" id="titleInput">
            </div>

            <div class="field-group">
                <label for="dateInput">日時</label>
                <input type="datetime-local" id="dateInput">
            </div>

            <div class="field-group">
                <label for="notesInput">詳細・メモ</label>
                <input type="text" id="notesInput">
            </div>

            <button class="btn btn-add" onclick="addToCalendar()">iPhoneカレンダーに追加する 📅</button>
        </div>
    </div>

    <script>
        // メモの解析処理
        function parseMemo() {
            const memo = document.getElementById('memoInput').value.trim();
            if (!memo) return;

            const lines = memo.split('\n').filter(l => l.trim() !== '');
            let title = lines[0] || '新しい予定';
            let notes = lines.slice(1).join('\n') || '';

            // 日付・時刻の自動解析 (簡易ロジック)
            let targetDate = new Date();
            
            // 「明日」「明後日」の判定
            if (memo.includes('明日')) {
                targetDate.setDate(targetDate.getDate() + 1);
            } else if (memo.includes('明後日')) {
                targetDate.setDate(targetDate.getDate() + 2);
            }

            // 「15:00」や「15時」などの時刻抽出
            const timeMatch = memo.match(/(\d{1,2})[:時](\d{2})?|(\d{1,2})時/);
            if (timeMatch) {
                let hours = parseInt(timeMatch[1] || timeMatch[3], 10);
                let minutes = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
                
                if (memo.includes('午後') && hours < 12) {
                    hours += 12;
                }
                
                targetDate.setHours(hours, minutes, 0, 0);
            } else {
                targetDate.setHours(targetDate.getHours() + 1, 0, 0, 0);
            }

            // datetime-local 形式（YYYY-MM-DDTHH:mm）に変換
            const year = targetDate.getFullYear();
            const month = String(targetDate.getMonth() + 1).padStart(2, '0');
            const day = String(targetDate.getDate()).padStart(2, '0');
            const hours = String(targetDate.getHours()).padStart(2, '0');
            const minutes = String(targetDate.getMinutes()).padStart(2, '0');
            
            const formattedDateTime = `${year}-${month}-${day}T${hours}:${minutes}`;

            // フィールドにセット
            document.getElementById('titleInput').value = title;
            document.getElementById('dateInput').value = formattedDateTime;
            document.getElementById('notesInput').value = notes;

            // 結果カードを表示
            document.getElementById('resultCard').style.display = 'block';
        }

        // iCalendar (.ics) ファイルを作成してダウンロード
        function addToCalendar() {
            const title = document.getElementById('titleInput').value || '新しい予定';
            const dateTimeVal = document.getElementById('dateInput').value;
            const notes = document.getElementById('notesInput').value || '';

            if (!dateTimeVal) {
                alert('日時を入力してください');
                return;
            }

            const startDate = new Date(dateTimeVal);
            const endDate = new Date(startDate.getTime() + (60 * 60 * 1000)); // 1時間後

            // UTC形式の文字列に変換 (YYYYMMDDTHHMMSSZ)
            const formatDate = (date) => {
                return date.toISOString().replace(/-|:|\.\d+/g, '');
            };

            // .ics フォーマット作成
            const icsData = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//YumeFuwa Calendar//JP',
                'BEGIN:VEVENT',
                `SUMMARY:${title}`,
                `DESCRIPTION:${notes.replace(/\n/g, '\\n')}`,
                `DTSTART:${formatDate(startDate)}`,
                `DTEND:${formatDate(endDate)}`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            // ファイルダウンロード設定
            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'event.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
