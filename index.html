<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふわふわメモカレンダー</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome アイコン -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 50%, #ffffff 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --primary-blue: #38bdf8;
      --deep-blue: #0284c7;
      --soft-blue: #e0f2fe;
      --text-main: #334155;
      --text-muted: #64748b;
      --glow-blue: rgba(56, 189, 248, 0.4);
    }

    * {
      box-sizing: border-box;
      font-family: 'M PLUS Rounded 1c', -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* 背景のキラキラ魔法粒子 */
    .magic-sparkle {
      position: absolute;
      color: #7dd3fc;
      opacity: 0.8;
      animation: magicFloat 5s infinite ease-in-out;
      pointer-events: none;
      z-index: 0;
      filter: drop-shadow(0 0 6px #bae6fd);
    }

    @keyframes magicFloat {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.4; }
      50% { transform: translateY(-20px) scale(1.4) rotate(25deg); opacity: 1; }
    }

    /* ヘッダー */
    .header {
      text-align: center;
      margin-bottom: 32px;
      z-index: 1;
      animation: floatHeader 4s infinite ease-in-out;
    }

    @keyframes floatHeader {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .header h1 {
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      color: var(--deep-blue);
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 28px;
      border-radius: 50px;
      border: 2px solid #bae6fd;
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.25), inset 0 0 15px rgba(224, 242, 254, 0.8);
      backdrop-filter: blur(8px);
    }

    .header p {
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      color: #0284c7;
      margin-top: 12px;
      margin-bottom: 0;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 0 10px #ffffff;
    }

    /* メインコンテナ */
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 36px;
      padding: clamp(24px, 5vw, 36px);
      box-shadow: 0 20px 50px rgba(56, 189, 248, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.9);
      border: 4px solid #ffffff;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(12px);
    }

    /* 【枠外右上】文字なし・魔法のお星さまモチーフ */
    .magic-icon-badge {
      position: absolute;
      top: -28px;
      right: 10px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 100%);
      border-radius: 50%;
      border: 3px solid #7dd3fc;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 0 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #38bdf8;
      animation: magicWandBounce 3.5s infinite ease-in-out;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes magicWandBounce {
      0%, 100% { transform: translateY(0) rotate(-10deg) scale(1); }
      50% { transform: translateY(-10px) rotate(15deg) scale(1.1); }
    }

    .input-group {
      margin-bottom: 22px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--deep-blue);
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 125px;
      padding: 18px;
      border: 2px solid #bae6fd;
      border-radius: 24px;
      font-size: 1rem;
      color: var(--text-main);
      background-color: rgba(240, 249, 255, 0.7);
      outline: none;
      transition: all 0.3s ease;
      resize: vertical;
      font-weight: 700;
      box-shadow: inset 0 2px 6px rgba(56, 189, 248, 0.08);
    }

    textarea:focus {
      border-color: var(--primary-blue);
      background-color: #ffffff;
      box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.25), inset 0 2px 4px rgba(0,0,0,0.02);
    }

    /* 魔法ボタン */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 26px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.05em;
    }

    .btn-parse {
      background: linear-gradient(135deg, #7dd3fc 0%, #0284c7 100%);
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-parse::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: rotate(30deg);
      transition: 0.8s;
    }

    .btn-parse:hover::after {
      left: 100%;
    }

    .btn-parse:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.5);
    }

    .btn-parse:active {
      transform: translateY(1px) scale(0.98);
    }

    /* ローディング状態 */
    .btn-loading {
      opacity: 0.8;
      pointer-events: none;
    }

    /* 結果カード */
    .preview-card {
      margin-top: 26px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #bae6fd;
      border-radius: 28px;
      padding: 22px;
      display: none;
      box-shadow: 0 12px 32px rgba(186, 230, 253, 0.5);
      animation: magicPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes magicPop {
      0% { opacity: 0; transform: scale(0.85) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .preview-card h2 {
      margin-top: 0;
      font-size: 1.15rem;
      color: var(--deep-blue);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px stroke #e0f2fe;
      padding-bottom: 8px;
    }

    .field {
      margin-bottom: 12px;
      background: var(--soft-blue);
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid #ffffff;
    }

    .field-label {
      font-size: 0.75rem;
      color: #0284c7;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .field-value {
      font-size: 1.02rem;
      color: var(--text-main);
      font-weight: 800;
      word-break: break-all;
      margin-top: 4px;
    }

    .calendar-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-apple {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.3);
    }

    .btn-timetree {
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(5, 150, 105, 0.3);
    }

    .btn-apple:hover, .btn-timetree:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .tip-box {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(240, 249, 255, 0.6);
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.6;
      border: 1px solid #e0f2fe;
      font-weight: 700;
    }

    /* トースト通知 */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      color: #fff;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 800;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4);
      border: 2px solid #ffffff;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<!-- キラキラ粒子アニメーション -->
<i class="fa-solid fa-sparkles magic-sparkle" style="top: 8%; left: 10%; font-size: 1.4rem; animation-delay: 0s;"></i>
<i class="fa-solid fa-star magic-sparkle" style="top: 20%; right: 12%; font-size: 1.1rem; animation-delay: 1.2s;"></i>
<i class="fa-solid fa-wand-magic-sparkles magic-sparkle" style="top: 70%; left: 8%; font-size: 1.6rem; animation-delay: 2.5s;"></i>
<i class="fa-solid fa-moon magic-sparkle" style="bottom: 12%; right: 10%; font-size: 1.3rem; animation-delay: 0.8s;"></i>

<!-- ヘッダー -->
<div class="header">
  <h1><i class="fa-solid fa-wand-magic-sparkles" style="color: #38bdf8;"></i> ふわっとメモカレンダー</h1>
  <p>✨ メモを入れると魔法でカレンダーに早変わり ✨</p>
</div>

<div class="container">

  <!-- 枠外右上：文字なしの魔法お星さまバッジ -->
  <div class="magic-icon-badge">
    <i class="fa-solid fa-wand-magic"></i>
  </div>

  <div class="input-group">
    <label for="memoInput"><i class="fa-solid fa-sparkles"></i> 魔法のメモを入力してね</label>
    <textarea id="memoInput" placeholder="例：&#10;明日 終日 ディズニー行く！&#10;または&#10;8月10日 15:00 カフェで打ち合わせ"></textarea>
  </div>

  <button class="btn btn-parse" id="parseBtn" onclick="parseMemo()">
    <i class="fa-solid fa-wand-magic-sparkles"></i> 予定を魔法でまとめる！
  </button>

  <!-- 結果カード -->
  <div id="previewCard" class="preview-card">
    <h2><i class="fa-solid fa-hat-wizard" style="color: #38bdf8;"></i> まとめた魔法結果</h2>
    
    <div class="field">
      <div class="field-label"><i class="fa-regular fa-clock"></i> 日時</div>
      <div class="field-value" id="resDateTime">-</div>
    </div>

    <div class="field">
      <div class="field-label"><i class="fa-solid fa-star"></i> 件名</div>
      <div class="field-value" id="resTitle">-</div>
    </div>

    <div class="field">
      <div class="field-label"><i class="fa-solid fa-align-left"></i> 詳細内容</div>
      <div class="field-value" id="resBody" style="white-space: pre-wrap; font-weight: 500;">-</div>
    </div>

    <div class="calendar-actions">
      <button class="btn btn-apple" onclick="downloadICS()">
        <i class="fa-brands fa-apple"></i> iPhoneカレンダーに追加 (.ics)
      </button>

      <button class="btn btn-timetree" onclick="openTimeTree()">
        <i class="fa-solid fa-tree"></i> TimeTreeに追加（コピー＆起動）
      </button>
    </div>

    <div class="tip-box">
      <strong>💡 アプリ連携のアドバイス</strong><br>
      • <strong>iPhoneカレンダー:</strong> ボタンを押すとそのまま予定追加画面が開きます。<br>
      • <strong>TimeTree:</strong> 予定内容がコピーされた状態でアプリが開きます。新規作成画面に貼り付けて登録してね♪
    </div>
  </div>
</div>

<div id="toast" class="toast">✨ クリップボードにコピーしたよ！</div>

<script>
let parsedEvent = null;

// ===============================================
// 🌐 API連携設定（必要に応じて接続先URLを設定）
// ===============================================
const API_CONFIG = {
  // 実装したAPIのエンドポイントURLを指定してください（例: '/api/parse-memo'）
  endpoint: '', 
  useAPI: false // API連携を有効化する場合は true に変更します
};

async function parseMemo() {
  const text = document.getElementById('memoInput').value.trim();
  if (!text) {
    alert('メモを入力してくださいね！');
    return;
  }

  const btn = document.getElementById('parseBtn');
  btn.classList.add('btn-loading');
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 魔法をかけています...';

  try {
    if (API_CONFIG.useAPI && API_CONFIG.endpoint) {
      // 📡 API経由で解析する場合
      parsedEvent = await parseWithAPI(text);
    } else {
      // 🪄 ローカルロジックで解析する場合（フォールバック）
      parsedEvent = parseLocalMemo(text);
    }

    updatePreviewUI(parsedEvent);
  } catch (error) {
    console.error('API Error:', error);
    // API呼び出しでエラーが起きた場合はローカルロジックに切り替え
    parsedEvent = parseLocalMemo(text);
    updatePreviewUI(parsedEvent);
  } finally {
    btn.classList.remove('btn-loading');
    btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> 予定を魔法でまとめる！';
  }
}

// API連携関数
async function parseWithAPI(text) {
  const response = await fetch(API_CONFIG.endpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ memo: text })
  });

  if (!response.ok) {
    throw new Error('APIリクエストに失敗しました');
  }

  const data = await response.json();
  
  // APIレスポンス形式に合わせてDateオブジェクトを組み立て
  const startDate = new Date(data.year, data.month - 1, data.day, data.startHour, data.startMinute);
  const endDate = new Date(data.year, data.month - 1, data.day, data.endHour, data.endMinute);

  return {
    start: startDate,
    end: endDate,
    year: data.year,
    month: data.month,
    day: data.day,
    startHour: data.startHour,
    startMinute: data.startMinute,
    endHour: data.endHour,
    endMinute: data.endMinute,
    isAllDay: data.isAllDay || false,
    title: data.title,
    description: data.description
  };
}

// ローカルでの解析処理（ルールベース）
function parseLocalMemo(text) {
  const now = new Date();
  let year = now.getFullYear();
  let month = now.getMonth() + 1;
  let day = now.getDate();
  
  let startHour = 9;
  let startMinute = 0;
  let endHour = 10;
  let endMinute = 0;
  let isAllDay = false;

  // 日付の判定
  if (text.includes('明日') || text.includes('あした')) {
    const tomorrow = new Date(now);
    tomorrow.setDate(now.getDate() + 1);
    year = tomorrow.getFullYear();
    month = tomorrow.getMonth() + 1;
    day = tomorrow.getDate();
  } else if (text.includes('明後日') || text.includes('あさって')) {
    const dayAfter = new Date(now);
    dayAfter.setDate(now.getDate() + 2);
    year = dayAfter.getFullYear();
    month = dayAfter.getMonth() + 1;
    day = dayAfter.getDate();
  } else {
    const fullDateMatch = text.match(/(\d{4})[\/\.-年](\d{1,2})[\/\.-月](\d{1,2})/);
    const shortDateMatch = text.match(/(\d{1,2})[\/\.-月](\d{1,2})日?/);

    if (fullDateMatch) {
      year = parseInt(fullDateMatch[1]);
      month = parseInt(fullDateMatch[2]);
      day = parseInt(fullDateMatch[3]);
    } else if (shortDateMatch) {
      month = parseInt(shortDateMatch[1]);
      day = parseInt(shortDateMatch[2]);
    }
  }

  // 時間の判定ルール
  const timeMatch = text.match(/(\d{1,2})[:：](\d{2})/) || text.match(/(\d{1,2})時((\d{1,2})分)?/);

  if (text.includes('終日')) {
    // 1. 「終日」の記載がある場合 ➔ 9:00〜22:00
    startHour = 9;
    startMinute = 0;
    endHour = 22;
    endMinute = 0;
    isAllDay = true;
  } else if (timeMatch) {
    // 2. 時間の記載がある場合 ➔ 指定時間〜1時間後
    startHour = parseInt(timeMatch[1]);
    if (timeMatch[2] && !timeMatch[2].includes('分')) {
      startMinute = parseInt(timeMatch[2]);
    } else if (timeMatch[3]) {
      startMinute = parseInt(timeMatch[3]);
    }
    endHour = startHour + 1;
    endMinute = startMinute;
  } else {
    // 3. 時間の記載がない場合 ➔ デフォルト 9:00〜10:00
    startHour = 9;
    startMinute = 0;
    endHour = 10;
    endMinute = 0;
  }

  // タイトル抽出
  const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
  let titleText = lines[0] || '新規予定';
  titleText = titleText
    .replace(/(\d{4}[\/\.-年])?\d{1,2}[\/\.-月]\d{1,2}日?/, '')
    .replace(/(\d{1,2}[:：]\d{2}|\d{1,2}時(\d{1,2}分)?)/, '')
    .replace(/(明日|あした|明後日|あさって|今日|終日)/g, '')
    .trim();

  if (!titleText) titleText = '予定';

  const description = lines.length > 1 ? lines.slice(1).join('\n') : text;

  const startDate = new Date(year, month - 1, day, startHour, startMinute);
  const endDate = new Date(year, month - 1, day, endHour, endMinute);

  return {
    start: startDate,
    end: endDate,
    year, month, day, startHour, startMinute, endHour, endMinute, isAllDay,
    title: titleText,
    description: description
  };
}

// UI更新処理
function updatePreviewUI(event) {
  const pad = n => String(n).padStart(2, '0');
  const timeDisplay = event.isAllDay 
    ? `${event.year}年${event.month}月${event.day}日 09:00 〜 22:00 (終日)`
    : `${event.year}年${event.month}月${event.day}日 ${pad(event.startHour)}:${pad(event.startMinute)} 〜 ${pad(event.endHour)}:${pad(event.endMinute)}`;

  document.getElementById('resDateTime').textContent = timeDisplay;
  document.getElementById('resTitle').textContent = event.title;
  document.getElementById('resBody').textContent = event.description;

  document.getElementById('previewCard').style.display = 'block';
}

function formatDateToICS(date) {
  return date.toISOString().replace(/-|:|\.\d\d\d/g, '');
}

function downloadICS() {
  if (!parsedEvent) return;

  const icsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//FuwaFuwa Magic Memo App//JA
BEGIN:VEVENT
SUMMARY:${parsedEvent.title}
DESCRIPTION:${parsedEvent.description.replace(/\n/g, '\\n')}
DTSTART:${formatDateToICS(parsedEvent.start)}
DTEND:${formatDateToICS(parsedEvent.end)}
END:VEVENT
END:VCALENDAR`;

  const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${parsedEvent.title}.ics`;
  a.click();
  URL.revokeObjectURL(url);
}

function openTimeTree() {
  if (!parsedEvent) return;

  const pad = n => String(n).padStart(2, '0');
  const copyText = `【${parsedEvent.title}】\n日時: ${parsedEvent.year}/${parsedEvent.month}/${parsedEvent.day} ${pad(parsedEvent.startHour)}:${pad(parsedEvent.startMinute)}～${pad(parsedEvent.endHour)}:${pad(parsedEvent.endMinute)}\n\nメモ:\n${parsedEvent.description}`;

  navigator.clipboard.writeText(copyText).then(() => {
    showToast('✨ 魔法でコピーしたよ！TimeTreeを開きます♪');
    setTimeout(() => {
      window.location.href = 'timetree://';
      setTimeout(() => {
        window.location.href = 'https://timetreeapp.com/';
      }, 1500);
    }, 800);
  }).catch(() => {
    alert('コピーに失敗しちゃいました。手動でコピーしてね。');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>

</body>
</html>
