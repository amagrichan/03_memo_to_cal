<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆめふわ スケジュール登録</title>
    <style>
        /* ゲーム風ゆめふわ背景設定 */
        body {
            margin: 0;
            padding: 50px 20px 30px 20px;
            font-family: "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #a5f3fc 0%, #c4b5fd 50%, #fbcfe8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
            color: #475569;
            overflow-x: hidden;
            position: relative;
        }

        /* アニメーションする光・星（ゲーム風演出） */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle, #ffffff 15%, transparent 20%),
                radial-gradient(circle, #f472b6 10%, transparent 15%),
                radial-gradient(circle, #38bdf8 15%, transparent 20%);
            background-size: 80px 80px, 120px 120px, 100px 100px;
            background-position: 0 0, 40px 60px, 20px 30px;
            opacity: 0.4;
            animation: starsMove 10s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes starsMove {
            0% { background-position: 0 0, 40px 60px, 20px 30px; }
            100% { background-position: 80px 160px, 160px 220px, 120px 190px; }
        }

        /* 漂う背景の雲 */
        .cloud-bg {
            position: fixed;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 100px;
            filter: blur(8px);
            pointer-events: none;
            z-index: 0;
            animation: floatCloud 20s ease-in-out infinite alternate;
        }
        .cloud-1 { top: 10%; left: -50px; width: 220px; height: 90px; }
        .cloud-2 { bottom: 15%; right: -40px; width: 260px; height: 110px; animation-delay: -10s; }

        @keyframes floatCloud {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(40px) translateY(-20px); }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 1;
        }

        /* 右上枠外のうさぎちゃん (80%サイズ) */
        .bunny-badge {
            position: absolute;
            top: -55px;
            right: -10px;
            width: 110px;
            height: auto;
            z-index: 10;
            filter: drop-shadow(0 8px 12px rgba(196, 181, 253, 0.6));
            animation: bunnyHop 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes bunnyHop {
            0%, 100% { transform: translateY(0px) rotate(3deg); }
            50% { transform: translateY(-8px) rotate(-2deg); }
        }

        /* ヘッダー */
        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            color: #ffffff;
            margin: 0;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 3px 6px rgba(147, 51, 234, 0.3), 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* ゲーム風ポップカードUI */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 22px;
            box-shadow: 
                0 12px 30px rgba(165, 180, 252, 0.4),
                inset 0 0 15px rgba(255, 255, 255, 0.9);
            border: 3px solid #ffffff;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 1);
        }

        /* 入力フォーム */
        textarea, input {
            width: 100%;
            border: 2px solid #bae6fd;
            border-radius: 18px;
            padding: 12px 14px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            color: #334155;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        textarea:focus, input:focus {
            border-color: #f472b6;
            box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.25);
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        /* ぷっくりゲーム風ボタン */
        .btn {
            width: 100%;
            border: none;
            border-radius: 22px;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            color: white;
            background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 100%);
            box-shadow: 0 6px 0px #0284c7, 0 8px 15px rgba(56, 189, 248, 0.4);
            cursor: pointer;
            transition: all 0.1s ease;
            margin-top: 6px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #0284c7, 0 4px 8px rgba(56, 189, 248, 0.4);
        }

        .btn-add {
            background: linear-gradient(180deg, #f472b6 0%, #e11d48 100%);
            box-shadow: 0 6px 0px #be123c, 0 8px 15px rgba(225, 29, 72, 0.4);
        }

        .btn-add:active {
            box-shadow: 0 2px 0px #be123c, 0 4px 8px rgba(225, 29, 72, 0.4);
        }

        /* 解析結果エリア */
        #resultCard {
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 背景のふわふわ雲 -->
    <div class="cloud-bg cloud-1"></div>
    <div class="cloud-bg cloud-2"></div>

    <div class="container">
        <!-- 右上枠外のうさぎちゃんイラスト -->
        <img src="bunny1.png" alt="うさぎちゃん" class="bunny-badge">

        <!-- ヘッダー -->
        <div class="header">
            <h1>✨ ゆめふわ スケジュール ✨</h1>
        </div>

        <!-- メモ入力エリア -->
        <div class="card">
            <div class="section-title">☁️ メモを入力してね</div>
            <textarea id="memoInput" placeholder="例：明日 終日 渋谷で買い物&#10;例2：明後日 カフェでお茶"></textarea>
            <button class="btn" onclick="parseMemo()">予定を読み取る 🪄</button>
        </div>

        <!-- 解析＆確認エリア -->
        <div class="card" id="resultCard">
            <div class="section-title" style="color: #f472b6;">🌸 抽出結果</div>
            
            <div class="field-group">
                <label for="titleInput">件名</label>
                <input type="text" id="titleInput">
            </div>

            <div class="field-group">
                <label for="dateInput">開始日時</label>
                <input type="datetime-local" id="dateInput">
            </div>

            <div class="field-group">
                <label for="endDateInput">終了日時</label>
                <input type="datetime-local" id="endDateInput">
            </div>

            <div class="field-group">
                <label for="notesInput">詳細・メモ</label>
                <input type="text" id="notesInput">
            </div>

            <button class="btn btn-add" onclick="addToCalendar()">カレンダーに追加する 📅</button>
        </div>
    </div>

    <script>
        function parseMemo() {
            const memo = document.getElementById('memoInput').value.trim();
            if (!memo) return;

            const lines = memo.split('\n').filter(l => l.trim() !== '');
            let title = lines[0] || '新しい予定';
            let notes = lines.slice(1).join('\n') || '';

            let startDate = new Date();
            let endDate = new Date();

            // 「明日」「明後日」の判定
            if (memo.includes('明日')) {
                startDate.setDate(startDate.getDate() + 1);
            } else if (memo.includes('明後日')) {
                startDate.setDate(startDate.getDate() + 2);
            }

            endDate.setTime(startDate.getTime());

            // 時間の判定ロジック
            const isAllDay = memo.includes('終日');
            const timeMatch = memo.match(/(\d{1,2})[:時](\d{2})?|(\d{1,2})時/);

            if (isAllDay) {
                // 【終日】指定がある場合：9:00 〜 22:00
                startDate.setHours(9, 0, 0, 0);
                endDate.setHours(22, 0, 0, 0);
            } else if (timeMatch) {
                // 時刻の記載がある場合
                let hours = parseInt(timeMatch[1] || timeMatch[3], 10);
                let minutes = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
                
                if (memo.includes('午後') && hours < 12) {
                    hours += 12;
                }
                
                startDate.setHours(hours, minutes, 0, 0);
                endDate.setTime(startDate.getTime() + (60 * 60 * 1000)); // 1時間後
            } else {
                // 【記載がない場合】：9:00 〜 10:00
                startDate.setHours(9, 0, 0, 0);
                endDate.setHours(10, 0, 0, 0);
            }

            // datetime-local 形式（YYYY-MM-DDTHH:mm）に変換するヘルパー関数
            const formatForInput = (d) => {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const hours = String(d.getHours()).padStart(2, '0');
                const minutes = String(d.getMinutes()).padStart(2, '0');
                return `${year}-${month}-${day}T${hours}:${minutes}`;
            };

            // フィールドにセット
            document.getElementById('titleInput').value = title;
            document.getElementById('dateInput').value = formatForInput(startDate);
            document.getElementById('endDateInput').value = formatForInput(endDate);
            document.getElementById('notesInput').value = notes;

            // 結果カードを表示
            document.getElementById('resultCard').style.display = 'block';
        }

        function addToCalendar() {
            const title = document.getElementById('titleInput').value || '新しい予定';
            const startVal = document.getElementById('dateInput').value;
            const endVal = document.getElementById('endDateInput').value;
            const notes = document.getElementById('notesInput').value || '';

            if (!startVal || !endVal) {
                alert('日時を入力してください');
                return;
            }

            const startDate = new Date(startVal);
            const endDate = new Date(endVal);

            const formatDate = (date) => {
                return date.toISOString().replace(/-|:|\.\d+/g, '');
            };

            const icsData = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//YumeFuwa Calendar//JP',
                'BEGIN:VEVENT',
                `SUMMARY:${title}`,
                `DESCRIPTION:${notes.replace(/\n/g, '\\n')}`,
                `DTSTART:${formatDate(startDate)}`,
                `DTEND:${formatDate(endDate)}`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'event.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
